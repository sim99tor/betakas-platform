function selectPackage(pkgId) {
  checkoutPkg = checkoutPkg === pkgId ? null : pkgId;
  render();
  window.scrollTo(0, document.body.scrollHeight ? 400 : 0);
}

function buyPackage(pkgId) {
  var me = currentUser();
  var pkg = TOKEN_PACKAGES.filter(function (p) { return p.id === pkgId; })[0];
  if (!pkg) return;

  var card = (document.getElementById("pay-card") || {}).value || "";

  // Tahsilat, komisyon/havuz ayrımı ve token basımı sunucuda yapılır.
  act(Api.buyPackage(pkg.id, card), function () {
    checkoutPkg = null;
    go("dashboard");
  });
}

/* ---------------- Abonelik ---------------- */

function subscribe(planId) {
  var me = currentUser();
  var plan = getPlan(planId);
  if (!plan) return;

  var card = (document.getElementById("sub-card") || {}).value || "";

  // İlk dönem tahsilatı da sunucuda, abonelik açılırken yapılır.
  act(Api.subscribe(plan.id, card), function () { go("dashboard"); });
}

function cancelSubscription() {
  var me = currentUser();
  var a = subscriptionOf(me);
  if (!a) return;
  if (!confirm(a.plan.name + " aboneliğin iptal edilsin mi? Basılmış tokenler hesabında kalır, yeni yenileme yapılmaz.")) return;
  act(Api.cancelSubscription());
}

// Demo ortamında gerçek zamanlayıcı yok: "Bu ayı simüle et" butonu bir dönem ilerletir.
function renewSubscription() {
  act(Api.renewSubscription());
}

// Abonelik dönemi tahsilatı tamamen sunucudadır (POST /api/billing/renew):
// token basımı, komisyon/havuz ayrımı, fatura kaydı ve sonraki yenileme tarihi orada işlenir.

/* ---------------- Testçi Paneli ---------------- */

// Talebin testçinin uzmanlığıyla örtüşen etiketleri.
function skillMatches(user, request) {
  var hay = (productCategoryOf(request) + " " + request.feedbackType + " " + request.title).toLocaleLowerCase("tr-TR");
  return (user.skills || []).filter(function (sk) {
    return hay.indexOf(sk.toLocaleLowerCase("tr-TR")) !== -1;
  });
}

function testerTaskRow(s, ctaLabel) {
  var r = getRequest(s.requestId);
  var o = getUser(r.ownerId);
  return '<div class="row-item">' + avatar(o) +
    '<div class="grow"><div class="title">' + esc(r.title) + "</div>" +
    '<div class="meta">' + esc(subtitleOf(o)) + " · " + r.credits + " token · " + esc(r.feedbackType) + "</div></div>" +
    statusBadge(s.status) +
    ' <button class="btn ' + (s.status === "approved" ? "primary" : "ghost") + ' sm" onclick="go(\'request\',\'' + r.id + '\')">' +
    esc(ctaLabel || (s.status === "approved" ? "Testi Teslim Et" : "Görüntüle")) + "</button></div>";
}

function viewTesterDashboard() {
  var me = currentUser();
  var rep = reputation(me.id);
  var mult = repMultiplier(me.id);
  var lvl = testerLevel(me.id);

  var active = S.sessions.filter(function (s) {
    return s.testerId === me.id && (s.status === "applied" || s.status === "approved");
  });
  var waiting = S.sessions.filter(function (s) {
    return s.testerId === me.id && (s.status === "submitted" || s.status === "disputed");
  });

  var html = '<div class="page-head"><h1>Merhaba, ' + esc(me.name.split(" ")[0]) + "</h1>" +
    '<div class="sub">' + esc(me.title) + " · " + esc(me.tagline) + "</div></div>";

  html += '<div class="section"><div class="tiles">' +
    '<div class="tile accent"><div class="label">Kullanılabilir Token</div><div class="value">' + balance(me.id) + '</div><div class="hint">toplam kazanç: ' + totalEarned(me.id) + "</div></div>" +
    '<div class="tile warn"><div class="label">Bekleyen Kazanç</div><div class="value">' + pendingEarnings(me.id) + '</div><div class="hint">escrow\'da, onay bekliyor</div></div>' +
    '<div class="tile"><div class="label">İtibar</div><div class="value">' + (rep.count ? rep.avg.toFixed(1) : "—") + '</div><div class="hint">' + (rep.count ? '<span class="star-static">' + starStr(rep.avg) + "</span> · çarpan " + mult + "×" : "henüz test yok") + "</div></div>" +
    '<div class="tile"><div class="label">Seviye</div><div class="value" style="font-size:19px;padding-top:6px">' + esc(lvl.name) + '</div><div class="hint">' +
      (lvl.next ? rep.completed + "/" + lvl.next + " test — sonraki seviye" : rep.completed + " onaylı test") + "</div></div>" +
  "</div></div>";

  if (mult < 1.2) {
    html += '<div class="notice">İtibar çarpanın şu an <strong>' + mult + "×</strong>. Ortalaman 4.5★ ve üzerine çıkınca aynı testten <strong>1.2×</strong> token kazanırsın.</div>";
  }

  // Public profil: itibarını platform dışında gösterebileceğin salt okunur sayfa
  var myRank = rankOf(me.id);
  html += '<div class="section"><h2>Public Profilin</h2><div class="card">';
  if (myRank) {
    var myBadge = reputationBadge(myRank);
    html += '<div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px">' +
      '<span class="badge ' + myBadge.cls + '">' + esc(myBadge.label) + "</span>" +
      '<span class="badge good">Top %' + myRank.pct + " testçi</span>" +
      '<span class="badge">' + myRank.total + " testçi içinde " + myRank.position + ". sıra</span></div>" +
      '<div class="help">Giriş gerektirmeyen, herkese açık bir sayfa. Linki özgeçmişine ya da LinkedIn profiline koyabilirsin.</div>' +
      '<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">' +
        '<button class="btn primary sm" onclick="openPublicProfile(\'' + me.id + '\')">Profilimi Gör</button>' +
        '<button class="btn sm" onclick="copyPublicLink(\'' + me.id + '\')">Linki Kopyala</button>' +
        '<button class="btn ghost sm" onclick="copyShareText(\'' + me.id + '\')">Paylaşım Metnini Kopyala</button>' +
      "</div>";
  } else {
    html += '<div class="empty">İlk onaylı testinden sonra public profilin ve itibar rozetin açılır.</div>';
  }
  html += "</div></div>";

  // Aktif görevler
  html += '<div class="section"><h2>Aktif Görevlerin</h2><div class="card">';
  if (active.length) {
    html += active.map(function (s) { return testerTaskRow(s); }).join("");
  } else {
    html += '<div class="empty">Aktif görevin yok. <a href="javascript:go(\'discover\')">Açık testler</a>\'e göz at ve başvur.</div>';
  }
  html += "</div></div>";

  // Onay bekleyen teslimler
  if (waiting.length) {
    html += '<div class="section"><h2>Onay Bekleyen Teslimlerin</h2><div class="card">' +
      waiting.map(function (s) {
        var r = getRequest(s.requestId);
        return '<div class="row-item"><div class="grow"><div class="title">' + esc(r.title) + "</div>" +
          '<div class="meta">' + timeAgo(s.submittedAt) + " teslim edildi · " + r.credits + "  token escrow'da · 72 saat içinde yanıt gelmezse otomatik onaylanır</div></div>" +
          statusBadge(s.status) +
          ' <button class="btn ghost sm" onclick="go(\'request\',\'' + r.id + '\')">Görüntüle</button></div>';
      }).join("") + "</div></div>";
  }

  // Uzmanlığa uygun açık testler
  var suggestions = S.requests.filter(function (r) {
    if (r.status !== "open" || slotsLeft(r) <= 0) return false;
    return !S.sessions.some(function (s) { return s.requestId === r.id && s.testerId === me.id; });
  }).map(function (r) {
    return { r: r, cat: categoryMatch(me, r), matches: skillMatches(me, r) };
  }).sort(function (a, b) {
    return (b.cat ? 1 : 0) - (a.cat ? 1 : 0) || b.matches.length - a.matches.length ||
      (b.r.boosted ? 1 : 0) - (a.r.boosted ? 1 : 0) || b.r.createdAt - a.r.createdAt;
  }).slice(0, 3);

  html += '<div class="section"><h2>Sana Uygun Açık Testler</h2><div class="card">';
  if (suggestions.length) {
    html += suggestions.map(function (x) {
      var r = x.r, o = getUser(r.ownerId);
      var earn = Math.round(r.credits * mult);
      return '<div class="row-item">' + avatar(o) +
        '<div class="grow"><div class="title">' + esc(r.title) + "</div>" +
        '<div class="meta">' + esc(subtitleOf(o)) + " · " + esc(r.feedbackType) + " · " + slotsLeft(r) + " slot boş" +
        (x.matches.length ? ' · <span style="color:var(--aqua)">etiket eşleşmesi: ' + esc(x.matches.join(", ")) + "</span>" : "") +
        "</div></div>" +
        (x.cat ? '<span class="badge good">' + esc(x.cat) + "</span> " : "") +
        '<span class="badge credit">+' + earn + " token</span>" +
        ' <button class="btn primary sm" onclick="applyTo(\'' + r.id + '\')">Başvur</button></div>';
    }).join("") +
    '<div style="margin-top:10px"><button class="btn ghost sm" onclick="go(\'discover\')">Tüm açık testleri gör →</button></div>';
  } else {
    html += '<div class="empty">Şu an başvurabileceğin yeni test yok. Yeni talepler açıldığında burada listelenir.</div>';
  }
  html += "</div></div>";

  // Son kazançlar
  var earnings = S.ledger.filter(function (e) { return e.to === me.id; }).slice(-4).reverse();
  if (earnings.length) {
    html += '<div class="section"><h2>Son Kazançlar</h2><div class="card">' +
      earnings.map(function (e) {
        return '<div class="row-item"><div class="grow"><div class="title" style="font-weight:500;font-size:13.5px">' + esc(e.note) + "</div>" +
          '<div class="meta">' + fmtDate(e.ts) + "</div></div>" +
          '<span style="font-variant-numeric:tabular-nums;font-weight:700;color:var(--good)">+' + e.amount + "</span></div>";
      }).join("") +
      '</div><div style="margin-top:10px"><button class="btn ghost sm" onclick="go(\'ledger\')">Tüm kazançlarımı gör →</button></div></div>';
  }

  return html;
}

/* ---------------- Görevlerim (testçi) ---------------- */

function viewTasks() {
  var me = currentUser();
  var mine = S.sessions.filter(function (s) { return s.testerId === me.id; })
    .sort(function (a, b) { return (b.submittedAt || b.appliedAt || 0) - (a.submittedAt || a.appliedAt || 0); });

  var groups = [
    { key: "approved", title: "Test Edilecekler", hint: "Başvurun onaylandı — senaryoyu uygula, ekran kaydıyla teslim et." },
    { key: "applied", title: "Onay Bekleyen Başvurular", hint: "Talep sahibinin başvurunu onaylaması bekleniyor." },
    { key: "submitted", title: "Puan Bekleyen Teslimler", hint: "Token escrow'da; onaylanınca ya da 72 saat sonunda hesabına geçer." },
    { key: "disputed", title: "İtirazlı Teslimler", hint: "Yönetim incelemesinde." },
    { key: "accepted", title: "Tamamlanan Testler", hint: "Tokeni hesabına geçmiş testler." },
    { key: "rejected", title: "Reddedilenler", hint: "İtiraz sonucu token talep sahibine iade edildi." }
  ];

  var html = '<div class="page-head"><h1>Görevlerim</h1>' +
    '<div class="sub">Tüm başvuruların, devam eden testlerin ve teslim geçmişin tek listede.</div></div>';

  if (!mine.length) {
    return html + '<div class="card"><div class="empty">Henüz hiç göreve başvurmadın. <a href="javascript:go(\'discover\')">Açık testler</a>\'e göz at.</div></div>';
  }

  groups.forEach(function (g) {
    var rows = mine.filter(function (s) { return s.status === g.key; });
    if (!rows.length) return;
    html += '<div class="section"><h2>' + g.title + " (" + rows.length + ")</h2>" +
      '<p style="font-size:12.5px;color:var(--muted);margin:-6px 0 10px">' + esc(g.hint) + "</p>" +
      '<div class="card">' + rows.map(function (s) {
        var r = getRequest(s.requestId);
        var o = getUser(r.ownerId);
        var extra = s.status === "accepted" && s.rating
          ? '<span class="star-static">' + starStr(s.rating) + "</span> "
          : "";
        return '<div class="row-item">' + avatar(o) +
          '<div class="grow"><div class="title">' + esc(r.title) + "</div>" +
          '<div class="meta">' + esc(o.name) + " · " + esc(subtitleOf(o)) + " · " + r.credits + " token · " +
          (s.submittedAt ? timeAgo(s.submittedAt) + " teslim" : timeAgo(s.appliedAt) + " başvuru") + "</div></div>" +
          extra + statusBadge(s.status) +
          ' <button class="btn ' + (s.status === "approved" ? "primary" : "ghost") + ' sm" onclick="go(\'request\',\'' + r.id + '\')">' +
          (s.status === "approved" ? "Teslim Et" : "Aç") + "</button></div>";
      }).join("") + "</div></div>";
  });

  return html;
}

/* ---------------- Keşfet ---------------- */

function viewDiscover() {
  var me = currentUser();
  var open = S.requests.filter(function (r) {
    if (r.status !== "open") return false;
    if (r.ownerId === me.id) return false;
    // Rakip gizliliği: sektöre kapalı talepler aynı sektördeki kuruculara görünmez
    // (testçilerin sektörü yoktur, rakip değildirler — onlara görünür)
    if (r.visibility === "exclude-sector" && me.sector && getUser(r.ownerId).sector === me.sector) return false;
    return true;
  });
  // Uzmanlık eşleşmesi en üstte: alaka önce, ücretli öne çıkarma sonra, en yeni en son.
  open.sort(function (a, b) {
    return (categoryMatch(me, b) ? 1 : 0) - (categoryMatch(me, a) ? 1 : 0) ||
      (b.boosted ? 1 : 0) - (a.boosted ? 1 : 0) ||
      (hasMatchPriority(b.ownerId) ? 1 : 0) - (hasMatchPriority(a.ownerId) ? 1 : 0) ||
      b.createdAt - a.createdAt;
  });

  var html = '<div class="page-head"><h1>' + (me.role === "tester" ? "Açık Testler" : "Keşfet") + "</h1>" +
    '<div class="sub">Test et, token kazan. İtibar çarpanın: <strong style="color:var(--warning)">' + repMultiplier(me.id) + "×</strong></div></div>";

  var myCats = expertiseLabels(me);
  var matchCount = open.filter(function (r) { return categoryMatch(me, r); }).length;
  if (myCats.length) {
    html += '<div class="notice">Uzmanlık alanların: ' +
      myCats.map(function (c) { return '<span class="badge violet">' + esc(c) + "</span>"; }).join(" ") +
      " · <strong>" + matchCount + "</strong> talep eşleşiyor, listede üstte gösteriliyorlar." +
      (me.role === "tester" ? ' <a href="javascript:go(\'profile\',\'' + me.id + '\')">Alanlarını düzenle</a>' : "") +
      "</div>";
  } else if (me.role === "tester") {
    html += '<div class="notice">Henüz uzmanlık alanı seçmedin. ' +
      '<a href="javascript:go(\'profile\',\'' + me.id + '\')">Profilinden seç</a> — sana uygun talepler listede üstte çıksın.</div>';
  }

  var hidden = S.requests.filter(function (r) {
    return r.status === "open" && r.ownerId !== me.id && me.sector &&
      r.visibility === "exclude-sector" && getUser(r.ownerId).sector === me.sector;
  }).length;
  if (hidden) {
    html += '<div class="notice">' + hidden + " talep, sektör gizliliği nedeniyle sana gösterilmiyor (talep sahibiyle aynı sektördesin).</div>";
  }

  if (!open.length) {
    return html + '<div class="card"><div class="empty">Şu an sana açık test talebi yok.</div></div>';
  }

  html += '<div class="req-grid">' + open.map(function (r) {
    var o = getUser(r.ownerId);
    var left = slotsLeft(r);
    var mySession = S.sessions.find(function (s) { return s.requestId === r.id && s.testerId === me.id; });
    var earn = Math.round(r.credits * repMultiplier(me.id));

    var action;
    if (mySession) {
      action = statusBadge(mySession.status) + ' <button class="btn ghost sm" onclick="go(\'request\',\'' + r.id + '\')">Aç</button>';
    } else if (left <= 0) {
      action = '<button class="btn sm" disabled>Slotlar doldu</button>';
    } else {
      action = '<button class="btn primary sm" onclick="applyTo(\'' + r.id + '\')">Başvur (+' + earn + ' token)</button>';
    }

    var rv = r.versionId ? getVersion(r.versionId) : null;
    var seenBefore = rv ? testedEarlierVersions(me.id, rv.id) : [];
    var match = categoryMatch(me, r);
    return '<div class="card req-card">' +
      '<div class="head">' +
      (match ? '<span class="badge good">Uzmanlığınla eşleşiyor</span>' : "") +
      (r.boosted ? '<span class="badge credit">Öne Çıkan</span>' : "") +
      (hasMatchPriority(r.ownerId) ? '<span class="badge violet">Öncelikli</span>' : "") +
      (rv ? '<span class="ver-badge">' + esc(rv.label) + "</span>" : "") +
      '<span class="badge cat">' + esc(productCategoryOf(r)) + '</span>' +
      '<span class="badge">' + esc(stageOf(r)) + '</span>' +
      '<span class="badge">' + esc(r.feedbackType) + '</span>' +
      '<span class="badge credit">' + r.credits + " token</span>" +
      (seenBefore.length ? '<span class="badge violet">' + esc(seenBefore[seenBefore.length - 1].label) + " testçisisin</span>" : "") +
      "</div>" +
      "<h3>" + esc(r.title) + "</h3>" +
      '<div class="scenario">' + esc(r.scenario) + "</div>" +
      '<div class="foot"><span class="owner" style="cursor:pointer" onclick="go(\'profile\',\'' + o.id + '\')">' + esc(subtitleOf(o)) + " · " + esc(o.name) + " · " + left + " slot</span>" +
      '<div class="grow"></div>' + action + "</div></div>";
  }).join("") + "</div>";

  return html;
}

/* ---------------- Talep Detayı ---------------- */

function stripStep(label, state) {
  return '<div class="step ' + state + '"><div class="dot">' + (state === "done" ? "✓" : "●") + "</div>" + label + "</div>";
}

function sessionStrip(s) {
  var order = ["applied", "approved", "submitted", "accepted"];
  var labels = { applied: "Başvuru", approved: "Test", submitted: "Teslim", accepted: "Token Serbest" };
  var idx = order.indexOf(s.status);
  if (s.status === "disputed" || s.status === "rejected") idx = 2;
  return '<div class="status-strip">' + order.map(function (st, i) {
    var state = i < idx ? "done" : (i === idx ? (s.status === "accepted" ? "done" : "now") : "");
    return stripStep(labels[st], state) + (i < 3 ? '<div class="bar"></div>' : "");
  }).join("") + "</div>";
}

function feedbackView(s) {
  var f = s.feedback;
  if (!f) return "";
  var r = getRequest(s.requestId);
  var tpl = templateOf(r);
  var wu = {
    evet: '<span class="badge good">✓ ' + esc(tpl.intentLabel) + "</span>",
    hayir: '<span class="badge serious">✗ ' + esc(tpl.intentLabel) + " değil</span>",
    belki: '<span class="badge credit">~ Belki</span>'
  };

  function block(label, text) {
    return '<div class="fb-block"><h4>' + esc(label) + "</h4><p>" + esc(text) + "</p></div>";
  }

  // Önce talebin şablonundaki alanlar sırayla, sonra şablon dışında kalan
  // (eski kayıtlardan gelen) alanlar — hiçbir içerik gizlenmesin.
  var shown = {};
  var html = tpl.fields.map(function (fl) {
    if (!f[fl.key]) return "";
    shown[fl.key] = true;
    return block(fl.label, f[fl.key]);
  }).join("");

  allFieldKeys().forEach(function (k) {
    if (shown[k] || !f[k] || typeof f[k] !== "string") return;
    html += block(fieldLabel(k), f[k]);
  });

  return html +
    '<div class="fb-block"><h4>' + esc(tpl.choice.label) + "</h4><p>" +
      (wu[f.wouldUse] || esc(f.wouldUse)) + " — " + esc(f.wouldUseWhy) + "</p></div>" +
    '<div class="fb-block"><h4>Test Kanıtı</h4><p>' +
      (s.proofUrl ? "" + esc(s.proofUrl) : '<span style="color:var(--critical)">Ekran kaydı eklenmemiş</span>') +
      " · " + (s.durationMin || 0) + " dk test süresi</p></div>";
}

function viewRequestDetail(id) {
  var r = getRequest(id);
  if (!r) return '<div class="card"><div class="empty">Talep bulunamadı.</div></div>';
  var me = currentUser();
  var o = getUser(r.ownerId);
  var isOwner = r.ownerId === me.id;
  var sessions = requestSessions(id);

  var ver = r.versionId ? getVersion(r.versionId) : null;
  var html = '<div class="page-head">' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">' +
      (ver ? '<span class="ver-badge" style="cursor:pointer" onclick="go(\'version\',\'' + ver.id + '\')">' + esc(ver.label) + "</span>" : "") +
      '<span class="badge cat">' + esc(productCategoryOf(r)) + '</span>' +
      '<span class="badge">' + esc(stageOf(r)) + '</span>' +
      '<span class="badge">' + esc(r.feedbackType) + '</span>' +
      '<span class="badge credit">' + r.credits + " token / test</span>" +
      (r.visibility === "exclude-sector" ? '<span class="badge lock">Aynı sektöre kapalı</span>' : "") +
      (r.status === "closed" ? '<span class="badge">Kapandı</span>' : "") +
    "</div>" +
    "<h1>" + esc(r.title) + "</h1>" +
    '<div class="sub">' + esc(subtitleOf(o)) + " · " + esc(o.name) + " · " + timeAgo(r.createdAt) + " açıldı · " + esc(r.url) + "</div></div>";

  html += '<div class="card"><h3>Test Senaryosu</h3><p style="color:var(--ink-2)">' + esc(r.scenario) + "</p></div>";

  // Sürüm bağlamı: bu sürümde ne değişti + testçi önceki sürümü test ettiyse regresyon uyarısı
  if (ver) {
    var earlier = testedEarlierVersions(me.id, ver.id);
    var vcl = changelogOf(ver);
    html += '<div class="card"><h3>' + esc(ver.label) + " sürümünde ne değişti?</h3>" +
      '<p style="color:var(--ink-2)">' + esc(ver.notes) + "</p>";

    // Kurucunun kapattığını söylediği maddeler — testçi için doğrudan regresyon listesi
    if (vcl && vcl.markedCount) {
      var marked = vcl.rows.filter(function (r) { return r.state; });
      html += '<div style="margin-top:14px">' + changelogSummary(vcl) +
        '<div class="buglist">' + marked.slice(0, 6).map(function (r) { return bugRow(r.bug, r.state, null); }).join("") + "</div>" +
        (marked.length > 6 ? '<div class="help">+ ' + (marked.length - 6) + " madde daha — tam listeyi sürüm karnesinde görebilirsin.</div>" : "") +
        (isOwner ? "" : '<div class="help">Bunlar ' + esc(vcl.source.label) + " testlerinde bildirilip kurucunun kapattığını söylediği buglar. Gerçekten düzelmiş mi, önce onları dene.</div>") +
      "</div>";
    }

    html += '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">' +
      '<button class="btn ghost sm" onclick="go(\'version\',\'' + ver.id + '\')">Sürüm karnesini gör</button>' +
      (earlier.length && !isOwner
        ? '<span class="badge violet">Bu ürünün ' + earlier.map(function (x) { return esc(x.label); }).join(", ") +
          " sürümünü test etmiştin — değişimi kıyaslayabilirsin</span>"
        : "") +
      "</div></div>";
  }

  if (isOwner && r.status === "open") {
    html += '<div class="card"><h3>Escrow Durumu</h3>' +
      '<div class="escrow-preview"><strong>' + escrowRemaining(r.id) + " token</strong> bu talep için blokede · " +
      slotsTaken(r.id) + "/" + r.slots + " slot dolu. Talebi kapatırsan kullanılmayan tokenler iade edilir.</div>" +
      '<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">' +
      '<button class="btn danger sm" onclick="closeRequest(\'' + r.id + '\')">Talebi Kapat & Kalan Tokenleri İade Al</button>' +
      (r.boosted
        ? '<span class="badge credit">Öne Çıkarıldı</span>'
        : '<button class="btn sm" onclick="boostRequest(\'' + r.id + '\')" title="Keşfet\'te listenin başında görün">Öne Çıkar (' + BOOST_COST + ' token)</button>') +
      "</div></div>";
  }

  var synth = isOwner ? synthesizeRequest(r.id) : null;
  if (synth) {
    html += '<div class="section" style="margin-top:22px"><h2>Sentez Raporu <span style="font-weight:400;font-size:13px;color:var(--muted)">(' + synth.testerCount + ' testçiden otomatik özet)</span></h2>' +
      '<div class="card printable">' +
        '<div class="tiles">' +
          '<div class="tile accent"><div class="label">' + esc(synth.intentLabel) + ' Oranı</div><div class="value">%' + synth.wouldUsePct + '</div><div class="hint">' + synth.wouldUse.evet + ' evet · ' + synth.wouldUse.belki + ' belki · ' + synth.wouldUse.hayir + ' hayır</div></div>' +
          '<div class="tile"><div class="label">Ortalama Puan</div><div class="value">' + synth.avgRating.toFixed(1) + '</div><div class="hint"><span class="star-static">' + starStr(synth.avgRating) + '</span></div></div>' +
          '<div class="tile"><div class="label">Ort. Test Süresi</div><div class="value">' + synth.avgDuration + ' <small>dk</small></div></div>' +
        '</div>' +
        (synth.impressionThemes.length ? '<div style="margin-top:16px"><h4 style="font-size:13px;margin-bottom:8px">Tekrarlayan İlk İzlenim Temaları</h4><div class="tag-row">' + synth.impressionThemes.map(function (k) { return '<span class="tag">' + esc(k.word) + " <b>×" + k.count + "</b></span>"; }).join("") + "</div></div>" : "") +
        (synth.bugThemes.length ? '<div style="margin-top:12px"><h4 style="font-size:13px;margin-bottom:8px">Tekrarlayan Bug Temaları</h4><div class="tag-row">' + synth.bugThemes.map(function (k) { return '<span class="tag">' + esc(k.word) + " <b>×" + k.count + "</b></span>"; }).join("") + "</div></div>" : "") +
        (synth.uxThemes.length ? '<div style="margin-top:12px"><h4 style="font-size:13px;margin-bottom:8px">Tekrarlayan UX Temaları</h4><div class="tag-row">' + synth.uxThemes.map(function (k) { return '<span class="tag">' + esc(k.word) + " <b>×" + k.count + "</b></span>"; }).join("") + "</div></div>" : "") +
        (!synth.impressionThemes.length && !synth.bugThemes.length && !synth.uxThemes.length ? '<p style="margin-top:12px;color:var(--muted);font-size:13px">Ortak tema tespiti için en az 2 onaylı feedback gerekir.</p>' : "") +
        '<div style="margin-top:16px" class="no-print"><button class="btn ghost sm" onclick="window.print()">Raporu Yazdır / PDF Kaydet</button></div>' +
      "</div></div>";
  }

  // ---- Oturumlar ----
  var mySession = sessions.find(function (s) { return s.testerId === me.id; });

  if (isOwner) {
    html += '<div class="section" style="margin-top:22px"><h2>Başvurular & Testler (' + sessions.length + ")</h2>";
    if (!sessions.length) html += '<div class="card"><div class="empty">Henüz başvuru yok.</div></div>';
    html += sessions.map(function (s) {
      var t = getUser(s.testerId);
      var rep = reputation(s.testerId);
      var card = '<div class="card"><div class="row-item" style="border:none;padding:0 0 6px;cursor:pointer" onclick="go(\'profile\',\'' + t.id + '\')">' + avatar(t) +
        '<div class="grow"><div class="title">' + esc(t.name) + " · " + esc(subtitleOf(t)) +
        ' <span class="role-pill ' + t.role + '">' + (ROLE_LABEL[t.role] || "") + "</span></div>" +
        '<div class="meta">İtibar: ' + (rep.count ? '<span class="star-static">' + starStr(rep.avg) + "</span> " + rep.avg.toFixed(1) + " (" + rep.completed + " test)" : "yeni üye") + "</div></div>" +
        statusBadge(s.status) + "</div>" + sessionStrip(s);

      if (s.status === "applied") {
        card += '<div style="display:flex;gap:8px"><button class="btn primary sm" onclick="approveApp(\'' + s.id + '\')">Başvuruyu Onayla</button>' +
          '<button class="btn ghost sm" onclick="rejectApp(\'' + s.id + '\')">Reddet</button></div>';
      }
      if (s.status === "submitted") {
        card += feedbackView(s) +
          '<div style="margin-top:14px"><h4 style="font-size:13px;margin-bottom:6px">Bu feedback ne kadar faydalı? (puan ver → token serbest kalır)</h4>' +
          '<div class="stars">' + [1, 2, 3, 4, 5].map(function (n) {
            return '<button title="' + n + ' yıldız" onclick="acceptFeedback(\'' + s.id + "'," + n + ')">★</button>';
          }).join("") + "</div>" +
          '<div style="margin-top:8px"><button class="btn danger sm" onclick="disputeFeedback(\'' + s.id + '\')">İtiraz Et (Admin\'e gönder)</button>' +
          '<span style="font-size:12px;color:var(--muted);margin-left:10px">72 saat içinde işlem yapmazsan otomatik onaylanır.</span></div></div>';
      }
      if (s.status === "accepted") {
        card += feedbackView(s) + '<div style="margin-top:10px"><span class="star-static">' + starStr(s.rating) + "</span> <strong>" + s.rating + "/5</strong> puan verildi · token serbest bırakıldı</div>";
      }
      if (s.status === "disputed") {
        card += feedbackView(s) + '<div class="notice" style="margin-top:10px;border-color:rgba(208,59,59,.4);background:rgba(208,59,59,.07)">İtiraz nedeni: ' + esc(s.disputeNote || "-") + " · Admin incelemesinde.</div>";
      }
      return card + "</div>";
    }).join("");
    html += "</div>";
  } else {
    // Test eden gözünden
    if (!mySession && r.status === "open" && slotsLeft(r) > 0) {
      var earn = Math.round(r.credits * repMultiplier(me.id));
      html += '<div class="card"><h3>Bu ürünü test et</h3>' +
        '<p style="color:var(--ink-2);margin-bottom:12px">Kazanç: <strong style="color:var(--warning)">' + earn + " token</strong>" +
        (earn !== r.credits ? " (" + r.credits + " × " + repMultiplier(me.id) + " itibar çarpanı)" : "") +
        " · Feedback onaylandığında hesabına geçer.</p>" +
        '<button class="btn primary" onclick="applyTo(\'' + r.id + '\')">Teste Başvur</button></div>';
    }
    if (mySession) {
      html += '<div class="card"><h3>Test Durumun</h3>' + sessionStrip(mySession);
      if (mySession.status === "applied") {
        html += '<p style="color:var(--muted);font-size:13px">Talep sahibinin başvurunu onaylaması bekleniyor.</p>';
      }
      if (mySession.status === "approved") {
        html += feedbackForm(mySession);
      }
      if (mySession.status === "submitted") {
        html += feedbackView(mySession) + '<p style="color:var(--muted);font-size:13px;margin-top:10px">Talep sahibinin onayı bekleniyor — 72 saat içinde yanıt gelmezse tokenin otomatik serbest kalır.</p>';
      }
      if (mySession.status === "accepted") {
        html += feedbackView(mySession) + '<div style="margin-top:10px"><span class="star-static">' + starStr(mySession.rating) + "</span> Feedback'in <strong>" + mySession.rating + "/5</strong> puan aldı · token hesabına geçti ✓</div>";
        if (!mySession.ownerRating) {
          html += '<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--hairline)">' +
            '<h4 style="font-size:13px;margin-bottom:6px">Bu talebi açan kurucuyu değerlendir</h4>' +
            '<p style="font-size:12.5px;color:var(--muted);margin-bottom:8px">Senaryo netliği, iletişim ve süreç kalitesi — diğer testçilere yardımcı olur.</p>' +
            '<div class="stars">' + [1, 2, 3, 4, 5].map(function (n) {
              return '<button title="' + n + ' yıldız" onclick="rateOwner(\'' + mySession.id + "'," + n + ')">★</button>';
            }).join("") + "</div></div>";
        } else {
          html += '<div style="margin-top:12px;font-size:13px;color:var(--muted)">Kurucuyu değerlendirdin: <span class="star-static">' + starStr(mySession.ownerRating) + "</span> " + mySession.ownerRating + "/5</div>";
        }
      }
      if (mySession.status === "disputed") {
        html += '<div class="notice" style="border-color:rgba(208,59,59,.4);background:rgba(208,59,59,.07)">Teslimin itiraza düştü: ' + esc(mySession.disputeNote || "") + " · Admin kararı bekleniyor.</div>";
      }
      html += "</div>";
    }
  }

  return html;
}

var MIN_LEN = { fi: 60, bugs: 30, ux: 60 };

// Form, talebin ürün aşamasına ait şablondan üretilir. Alan id'leri "fb-" + anahtar.
function feedbackForm(session) {
  var r = getRequest(session.requestId);
  var tpl = templateOf(r);

  return '<div style="margin-top:14px"><h3 style="margin-bottom:4px">Yapılandırılmış Feedback Formu</h3>' +
    '<p style="font-size:12.5px;color:var(--muted);margin-bottom:4px">Kalite denetimi: her alanda minimum içerik uzunluğu aranır; ekran kaydı zorunludur.</p>' +
    '<div style="margin-bottom:14px"><span class="badge cat">' + esc(stageOf(r)) + "</span> " +
      '<span style="font-size:12.5px;color:var(--muted)">' + esc(tpl.hint) + "</span></div>" +
    '<div class="form-grid">' +
    tpl.fields.map(function (f) {
      return fieldTextarea("fb-" + f.key, esc(f.label) + " <span class=\"req-star\">*</span>", f.placeholder, f.min);
    }).join("") +
    '<div class="form-row">' +
      '<div class="field"><label>' + esc(tpl.choice.label) + ' <span class="req-star">*</span></label>' +
      '<select id="fb-wu">' + tpl.choice.options.map(function (o) {
        return '<option value="' + esc(o.v) + '">' + esc(o.l) + "</option>";
      }).join("") + "</select></div>" +
      '<div class="field"><label>Test süresi (dakika) <span class="req-star">*</span></label><input id="fb-dur" type="number" min="5" value="20"></div>' +
    "</div>" +
    '<div class="field"><label>' + esc(tpl.choice.whyLabel) + ' <span class="req-star">*</span></label><input id="fb-wuwhy" placeholder="Kısaca gerekçen"></div>' +
    '<div class="field"><label>Ekran kaydı linki (Loom vb.) <span class="req-star">*</span></label><input id="fb-proof" placeholder="https://loom.com/share/..."><div class="help">Test kanıtı olmadan teslim kabul edilmez.</div></div>' +
    '<div><button class="btn primary" onclick="submitFeedback(\'' + session.id + '\')">Testi Teslim Et</button></div>' +
    "</div></div>";
}

function fieldTextarea(id, label, placeholder, min) {
  return '<div class="field"><label>' + label + "</label>" +
    '<textarea id="' + id + '" placeholder="' + esc(placeholder) + '" oninput="updCounter(\'' + id + "'," + min + ')"></textarea>' +
    '<div class="counter" id="' + id + '-c">0 / min ' + min + " karakter</div></div>";
}

function updCounter(id, min) {
  var v = document.getElementById(id).value.length;
  var c = document.getElementById(id + "-c");
  c.textContent = v + " / min " + min + " karakter";
  c.className = "counter" + (v >= min ? " ok" : "");
}

/* ---------------- Yeni Talep ---------------- */

function viewNewRequest() {
  var me = currentUser();
  var bal = balance(me.id);
  var vers = versionsOf(me.id).slice().reverse();
  var preselect = route.param && getVersion(route.param) && getVersion(route.param).ownerId === me.id ? route.param : (vers[0] ? vers[0].id : null);

  var head = '<div class="page-head"><h1>Yeni Test Talebi</h1>' +
    '<div class="sub">Kullanılabilir token: <strong style="color:var(--warning)">' + bal + "</strong> (≈ " + fmtTRY(bal * tokenPrice()) + ") · " +
    '<a href="javascript:go(\'buyTokens\')">token satın al</a></div></div>';

  if (!vers.length) {
    return head + '<div class="card"><div class="empty">Önce bir ürün sürümü oluşturmalısın — testler her zaman belirli bir sürüme açılır.<br><br>' +
      '<button class="btn primary" onclick="go(\'versions\')">Ürün Sürümü Oluştur</button></div></div>';
  }

function updVersionHint() {
  var el = document.getElementById("nr-version-hint");
  var v = getVersion(document.getElementById("nr-version").value);
  if (!el || !v) return;
  el.innerHTML = "" + esc(v.url) + " · " + esc(v.notes);
}

// Aşama seçilince testçinin göreceği form da değişir — ipucu anında güncellenir.
function updStageHint() {
  var el = document.getElementById("nr-stage-hint");
  var sel = document.getElementById("nr-stage");
  if (!el || !sel) return;
  var tpl = FEEDBACK_TEMPLATES[sel.value] || FEEDBACK_TEMPLATES[DEFAULT_STAGE];
  el.innerHTML = esc(tpl.hint) + " " + esc(tpl.linkHint) +
    " Testçi şu alanları dolduracak: " + tpl.fields.map(function (f) { return esc(f.label); }).join(" · ") + ".";
}

// Aşamaya özel senaryo şablonu varsa o, yoksa feedback türünün şablonu kullanılır.
function applyScenarioTemplate() {
  var stageEl = document.getElementById("nr-stage");
  var type = document.getElementById("nr-type").value;
  var ta = document.getElementById("nr-scenario");
  var tpl = (stageEl && STAGE_SCENARIOS[stageEl.value]) || SCENARIO_TEMPLATES[type];
  if (!tpl) return;
  if (ta.value.trim() && !confirm("Senaryo alanının içeriği şablonla değiştirilsin mi?")) return;
  ta.value = tpl;
}

function updEscrowPreview() {
  var el = document.getElementById("nr-preview");
  if (!el) return;
  var credits = parseInt(document.getElementById("nr-credits").value || "0", 10);
  var slots = parseInt(document.getElementById("nr-slots").value || "0", 10);
  var total = credits * slots;
  var bal = balance(currentUser().id);
  el.innerHTML = "<strong>" + total + " token</strong> escrow'a bloke edilecek (" + slots + " slot × " + credits + " token · " + fmtTRY(total * tokenPrice()) + " değerinde). " +
    (total > bal
      ? '<span style="color:var(--critical)">Yetersiz bakiye! Mevcut: ' + bal + " token — test yaparak kazanabilir ya da " +
        "<a href=\"javascript:go('buyTokens')\">token satın alabilirsin</a>.</span>"
      : "Kalan kullanılabilir token: " + (bal - total) + ".");
}

function viewRadar() {
  // En iyi test uzmanları
  var testers = S.users.filter(function (u) { return u.role !== "admin" && u.status === "active"; })
    .map(function (u) { var r = reputation(u.id); return { user: u, rep: r, mult: repMultiplier(u.id) }; })
    .filter(function (x) { return x.rep.completed > 0; })
    .sort(function (a, b) { return b.rep.avg - a.rep.avg || b.rep.completed - a.rep.completed; });

  // Ürün radarı: "kullanırdım" oranı
  var products = {};
  S.sessions.forEach(function (s) {
    if (s.status !== "accepted" || !s.feedback) return;
    var r = getRequest(s.requestId);
    var o = getUser(r.ownerId);
    if (!products[o.id]) products[o.id] = { owner: o, total: 0, yes: 0 };
    products[o.id].total++;
    if (s.feedback.wouldUse === "evet") products[o.id].yes++;
  });
  var prodList = Object.keys(products).map(function (k) { return products[k]; })
    .sort(function (a, b) { return (b.yes / b.total) - (a.yes / a.total); });

  var html = '<div class="page-head"><h1>Radar & Liderlik</h1>' +
    '<div class="sub">Gelecek vizyonu: bu tablo, yatırımcılar için bir keşif radarına dönüşür (opt-in).</div></div>';

  html += '<div class="section"><h2>En İyi Test Uzmanları</h2><div class="card">';
  if (testers.length) {
    html += testers.map(function (x, i) {
      return '<div class="row-item" style="cursor:pointer" onclick="go(\'profile\',\'' + x.user.id + '\')"><strong style="width:22px;color:var(--muted)">' + (i + 1) + "</strong>" + avatar(x.user) +
        '<div class="grow"><div class="title">' + esc(x.user.name) +
        ' <span class="role-pill ' + x.user.role + '">' + (ROLE_LABEL[x.user.role] || "") + "</span></div>" +
        '<div class="meta">' + esc(subtitleOf(x.user)) + " · " + x.rep.completed + " onaylı test</div></div>" +
        '<span class="star-static">' + starStr(x.rep.avg) + "</span><strong>" + x.rep.avg.toFixed(1) + "</strong>" +
        '<span class="badge credit">' + x.mult + "× çarpan</span></div>";
    }).join("");
  } else html += '<div class="empty">Henüz onaylı test yok.</div>';
  html += "</div></div>";

  html += '<div class="section"><h2>Ürün Doğrulama Radarı</h2><div class="card">';
  if (prodList.length) {
    html += prodList.map(function (p) {
      var pct = Math.round((p.yes / p.total) * 100);
      return '<div class="row-item" style="cursor:pointer" onclick="go(\'profile\',\'' + p.owner.id + '\')">' + avatar(p.owner) +
        '<div class="grow"><div class="title">' + esc(p.owner.startup) + '</div><div class="meta">' + esc(p.owner.tagline) + " · " + p.total + " onaylı test</div></div>" +
        '<span class="badge ' + (pct >= 50 ? "good" : "credit") + '">%' + pct + " kullanırdım</span></div>";
    }).join("");
  } else html += '<div class="empty">Veri yok.</div>';
  html += "</div></div>";
  return html;
}

function viewProfile(userId) {
  var u = getUser(userId);
  if (!u) return '<div class="card"><div class="empty">Kullanıcı bulunamadı.</div></div>';
  var rep = reputation(u.id);
  var mult = repMultiplier(u.id);
  var frep = founderRating(u.id);

  var completedTests = S.sessions.filter(function (s) { return s.testerId === u.id && s.status === "accepted"; })
    .sort(function (a, b) { return (b.submittedAt || 0) - (a.submittedAt || 0); });

    .sort(function (a, b) { return b.createdAt - a.createdAt; });

  var isTester = u.role === "tester";
  var lvl = testerLevel(u.id);

  var badges = [];
  if (rep.completed >= 3 && rep.avg >= 4.5) badges.push("Güvenilir Test Uzmanı");
  if (frep.count && frep.avg >= 4.5) badges.push("Net Senaryo Yazarı");
  if (["u1", "u2", "u3"].indexOf(u.id) !== -1) badges.push("Kuruluş Üyesi");
  if (isTester) badges.push("" + lvl.name);
  if (rep.penalties > 0) badges.push("" + rep.penalties + " itiraz cezası");

  var html = '<div class="card profile-head">' +
    '<div class="avatar profile-avatar ' + avatarCls(u.id) + '">' + esc(u.initials) + "</div>" +
    '<div class="grow"><h1 style="font-size:21px;margin-bottom:2px">' + esc(u.name) +
    ' <span class="role-pill ' + u.role + '">' + (ROLE_LABEL[u.role] || "") + "</span></h1>" +
    '<div style="color:var(--muted);font-size:13.5px">' + esc(subtitleOf(u)) + (u.tagline ? " · " + esc(u.tagline) : "") + "</div>" +
    (u.sector && u.sector !== "-" ? '<div style="margin-top:8px"><span class="badge cat">' + esc(u.sector) + "</span></div>" : "") +
    (expertiseLabels(u).length ? '<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">' +
      expertiseLabels(u).map(function (c) { return '<span class="badge violet">' + esc(c) + "</span>"; }).join("") + "</div>" : "") +
    (isTester && (u.skills || []).length ? '<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">' +
      u.skills.map(function (sk) { return '<span class="badge cat">' + esc(sk) + "</span>"; }).join("") + "</div>" : "") +
    "</div></div>";

  if (badges.length) {
    html += '<div style="margin:14px 0;display:flex;gap:8px;flex-wrap:wrap">' +
      badges.map(function (b) { return '<span class="badge">' + b + "</span>"; }).join("") + "</div>";
  }

  // Herkese açık itibar sayfasına geçiş
  if (rankOf(u.id)) {
    html += '<div style="margin-bottom:14px"><button class="btn ghost sm" onclick="openPublicProfile(\'' + u.id + '\')">' +
      "Public profili aç</button></div>";
  }

  html += '<div class="section"><div class="tiles">' +
    '<div class="tile accent"><div class="label">Testçi İtibarı</div><div class="value">' + (rep.count ? rep.avg.toFixed(1) : "—") + '</div><div class="hint">' + (rep.count ? '<span class="star-static">' + starStr(rep.avg) + "</span> · çarpan " + mult + "×" : "henüz test yok") + "</div></div>" +
    '<div class="tile"><div class="label">Tamamlanan Test</div><div class="value">' + rep.completed + "</div></div>" +
    (isTester
      ? '<div class="tile"><div class="label">Toplam Kazanç</div><div class="value">' + totalEarned(u.id) + '</div><div class="hint">token (bonuslar dahil)</div></div>' +
        '<div class="tile"><div class="label">Seviye</div><div class="value" style="font-size:19px;padding-top:6px">' + esc(lvl.name) + "</div></div>"
      : '<div class="tile"><div class="label">Kurucu Puanı</div><div class="value">' + (frep.count ? frep.avg.toFixed(1) : "—") + '</div><div class="hint">' + (frep.count ? frep.count + " testçi puanladı" : "henüz puan yok") + "</div></div>" +
        '<div class="tile"><div class="label">Açılan Talep</div><div class="value">' + ownedRequests.length + "</div></div>") +
  "</div></div>";

  // Kendi profilinde uzmanlık alanlarını değiştirebilirsin — eşleştirme anında yenilenir.
  if (isLoggedIn() && u.id === S.authUserId) {
    html += '<div class="section"><h2>Uzmanlık Alanların</h2><div class="card">' +
      '<div class="help">Seçtiğin kategorilerdeki talepler ' +
      (u.role === "tester" ? "Açık Testler" : "Keşfet") +
      ' sayfasında en üstte ve "Uzmanlığınla eşleşiyor" rozetiyle listelenir.</div>' +
      categoryPicker("pf-exp", expertiseOf(u), expertiseOtherOf(u)) +
      '<div style="margin-top:12px"><button class="btn primary sm" onclick="saveExpertise()">Kaydet</button></div>' +
      "</div></div>";
  }

  html += '<div class="section"><h2>Tamamlanan Testler</h2><div class="card">';
  if (completedTests.length) {
    html += completedTests.map(function (s) {
      var r = getRequest(s.requestId);
      return '<div class="row-item">' + (r ? '<div class="grow" style="cursor:pointer" onclick="go(\'request\',\'' + r.id + '\')">' : '<div class="grow">') +
        '<div class="title">' + esc(r ? r.title : "-") + '</div>' +
        '<div class="meta">' + (r ? esc(subtitleOf(getUser(r.ownerId))) : "") + " · " + timeAgo(s.submittedAt) + "</div></div>" +
        '<span class="star-static">' + starStr(s.rating) + "</span></div>";
    }).join("");
  } else {
    html += '<div class="empty">Henüz tamamlanmış test yok.</div>';
  }
  html += "</div></div>";

  if (isTester) return html; // testçinin açtığı talep olmaz

  // Ürün sürümleri — kamuya açık gelişim çizgisi
  var uv = versionsOf(u.id).slice().reverse();
  if (uv.length) {
    html += '<div class="section"><h2>Ürün Sürümleri</h2><div class="card">' +
      uv.map(function (v, i) {
        var st = versionStatus(v.id);
        var vs = versionStats(v.id);
        return '<div class="row-item" style="cursor:pointer" onclick="go(\'version\',\'' + v.id + '\')">' +
          '<div class="grow"><div class="title">' + verBadge(v, i === 0) + " " + esc(v.notes.split(".")[0]) + "</div>" +
          '<div class="meta">' + timeAgo(v.createdAt) + " · " + vs.tests + " onaylı test" +
          (vs.tests ? ' · <span class="star-static">' + starStr(vs.avgRating) + "</span> " + vs.avgRating.toFixed(1) : "") + "</div></div>" +
          '<span class="badge ' + st.cls + '">' + st.label + "</span></div>";
      }).join("") + "</div></div>";
  }

  html += '<div class="section"><h2>Açılan Talepler</h2><div class="card">';
  if (ownedRequests.length) {
    html += ownedRequests.map(function (r) {
      return '<div class="row-item" style="cursor:pointer" onclick="go(\'request\',\'' + r.id + '\')"><div class="grow"><div class="title">' + esc(r.title) +
        (r.boosted ? ' <span class="badge credit"></span>' : "") + '</div>' +
        '<div class="meta">' + esc(productCategoryOf(r)) + " · " + r.credits + " token · " + timeAgo(r.createdAt) + "</div></div>" +
        (r.status === "open" ? '<span class="badge good">Açık</span>' : '<span class="badge">Kapalı</span>') +
        "</div>";
    }).join("");
  } else {
    html += '<div class="empty">Henüz talep açılmamış.</div>';
  }
  html += "</div></div>";

  return html;
}

      subRevenue.length + " dönem faturalandı</div></div>" +

      fmtTRY(subRevenue.reduce(function (a, p) { return a + p.fee; }, 0)) + '</div><div class="hint">kalanı ödül havuzuna</div></div>' +
  "</div></div>";

      '<div class="field"><label>Platform komisyonu (%)</label>' +

      '<div class="field"><label>Token liste fiyatı (₺)</label>' +

      '<button class="btn primary" onclick="setTokenPrice()">Kaydet</button></div>' +
      '<div class="help">Paket fiyatları bu değerden türetilir.</div></div>' +

    '<div class="split-legend">' +

  html += '<div class="section"><h2>Ekonomi Sağlığı</h2><div class="card">' +

      }).join("") + "</div></div>";

  html += '<div class="section"><h2>Token Satışları</h2><div class="card table-wrap">';

          '<td class="num money">' + fmtTRY(p.pool) + "</td></tr>";
      }).join("") + "</tbody></table>";

    html += '<div class="empty">Henüz token satışı yok.</div>';
  }
  html += "</div></div>";

  html += cashLedgerTable(true);
  return html;
}

// ₺ hareketleri tablosu — admin tüm defteri, kullanıcı kendi satırlarını görür.
function cashLedgerTable(isAdmin) {
  var me = currentUser();
  var rows = S.cashLedger.slice().reverse().filter(function (e) {
    return isAdmin || e.from === me.id || e.to === me.id;
  });
  var labels = {
    commission: "Komisyon", purchase: "Token satışı", test_payout: "✓ Test ödemesi",
    withdrawal: "Çekim ödemesi", refund: "İade"
  };
  var html = '<div class="section"><h2>Para Defteri (₺)</h2>' +
    '<p style="font-size:12.5px;color:var(--muted);margin:-6px 0 10px">Token defteriyle aynı mantık: her ₺ hareketi kimden-kime satırıdır, bakiyeler defterden türetilir.</p>' +
    '<div class="card table-wrap">';
  if (!rows.length) return html + '<div class="empty">Henüz para hareketi yok.</div></div></div>';
  html += "<table><thead><tr><th>Tarih</th><th>İşlem</th><th>Gönderen</th><th>Alan</th><th class=\"num\">Tutar</th><th>Açıklama</th></tr></thead><tbody>" +
    rows.map(function (e) {
      var incoming = !isAdmin && e.to === me.id;
      var outgoing = !isAdmin && e.from === me.id;
      return "<tr><td style=\"white-space:nowrap\">" + fmtDate(e.ts) + "</td>" +
        "<td>" + (labels[e.type] || e.type) + "</td>" +
        "<td>" + esc(acctName(e.from)) + "</td>" +
        "<td>" + esc(acctName(e.to)) + "</td>" +
        '<td class="num money">' + (incoming ? '<span class="pos">+' + fmtTRY(e.amount) + "</span>"
          : outgoing ? '<span class="neg">−' + fmtTRY(e.amount) + "</span>" : fmtTRY(e.amount)) + "</td>" +
        "<td>" + esc(e.note) + "</td></tr>";
    }).join("") + "</tbody></table></div></div>";
  return html;
}

        '<button class="btn ghost sm" onclick="rejectUser(\'' + u.id + '\')">Reddet</button></div>';
    }).join("");
  } else html += '<div class="empty">Bekleyen başvuru yok. Kapalı ekosistem: her üye elle onaylanır.</div>';
  html += "</div></div>";

  // Anlaşmazlıklar
  html += '<div class="section"><h2>Anlaşmazlıklar</h2>';
  if (disputes.length) {
    html += disputes.map(function (s) {
      var r = getRequest(s.requestId);
      var t = getUser(s.testerId);
      var o = getUser(r.ownerId);
      return '<div class="card">' +
        '<div class="row-item" style="border:none;padding:0 0 8px">' + avatar(t) +
        '<div class="grow"><div class="title">' + esc(t.name) + " → " + esc(r.title) + '</div>' +
        '<div class="meta">Talep sahibi: ' + esc(o.name) + " · " + r.credits + " token ihtilafta</div></div>" +
        statusBadge("disputed") + "</div>" +
        '<div class="notice" style="border-color:rgba(208,59,59,.4);background:rgba(208,59,59,.07)">İtiraz nedeni: ' + esc(s.disputeNote || "-") + "</div>" +
        feedbackView(s) +
        '<div style="display:flex;gap:8px;margin-top:14px">' +
        '<button class="btn primary sm" onclick="resolveDispute(\'' + s.id + '\',\'release\')">Tokenleri Test Edene Ver</button>' +
        '<button class="btn danger sm" onclick="resolveDispute(\'' + s.id + '\',\'refund\')">Talep Sahibine İade Et</button>' +
        "</div></div>";
    }).join("");
  } else html += '<div class="card"><div class="empty">Açık anlaşmazlık yok.</div></div>';
  html += "</div>";

  // Şüpheli puanlama desenleri (sybil / danışıklı puan koruması)
  var collusion = detectCollusionPairs();
  html += '<div class="section"><h2>Şüpheli Puanlama Desenleri</h2>' +
    '<p style="font-size:12.5px;color:var(--muted);margin-bottom:12px;margin-top:-6px">İki kullanıcı karşılıklı olarak birbirine sürekli yüksek puan veriyorsa burada işaretlenir.</p>';
  if (collusion.length) {
    html += collusion.map(function (p) {
      var ua = getUser(p.userA), ub = getUser(p.userB);
      return '<div class="card"><div class="row-item" style="border:none;padding:0">' +
        '<div class="grow"><div class="title">' + esc(ua.name) + " " + esc(ub.name) + '</div>' +
        '<div class="meta">Karşılıklı ' + p.total + ' yüksek puanlı işlem · ort. ' + p.avgA.toFixed(1) + '★ / ' + p.avgB.toFixed(1) + '★</div></div>' +
        '<span class="badge ' + (p.risk === "high" ? "critical" : "credit") + '">' + (p.risk === "high" ? "Yüksek risk" : "İzlemede") + "</span>" +
        "</div></div>";
    }).join("");
  } else {
    html += '<div class="card"><div class="empty">Şüpheli karşılıklı puanlama deseni tespit edilmedi.</div></div>';
  }
  html += "</div>";

  return html;
}

function exportLedgerCSV() {
  var me = currentUser();
  var isAdmin = me.role === "admin";
  var rows = S.ledger.filter(function (e) { return isAdmin || e.from === me.id || e.to === me.id; });
  var header = ["Tarih", "Tür", "Gönderen", "Alan", "Token", "Açıklama"];
  var csvRows = [header].concat(rows.map(function (e) {
    return [fmtDate(e.ts), e.type, acctName(e.from), acctName(e.to), e.amount, e.note || ""];
  }));
  var csv = csvRows.map(function (row) {
    return row.map(function (cell) {
      var s = String(cell === null || cell === undefined ? "" : cell).replace(/"/g, '""');
      return /[",\n]/.test(s) ? '"' + s + '"' : s;
    }).join(",");
  }).join("\r\n");

  var csvWithBom = String.fromCharCode(0xFEFF) + csv;
  var blob = new Blob([csvWithBom], { type: "text/csv;charset=utf-8;" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "betakas-token-defteri-" + new Date().toISOString().slice(0, 10) + ".csv";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast("CSV indirildi ✓", "good");
}

function requestWithdrawal() {
  var me = currentUser();
  var avail = withdrawable(me.id);
  if (avail < MIN_WITHDRAWAL) {
    toast('Minimum çekim tutarı ' + fmtTRY(MIN_WITHDRAWAL) + '. Çekilebilir bakiyen: ' + fmtTRY(avail) + '.', 'bad');
    return;
  }

  var raw = prompt('Çekmek istediğin tutar (₺). Çekilebilir bakiye: ' + avail, String(avail));
  if (raw === null) return;
  var amount = Math.round(parseFloat(String(raw).replace(',', '.')) * 100) / 100;
  if (!amount || amount <= 0) { toast('Geçerli bir tutar gir.', 'bad'); return; }

  var iban = prompt('Ödemenin yapılacağı IBAN:', me.iban || 'TR** **** **** ****');
  if (iban === null) return;

  // Tutar/bakiye denetimi sunucuda tekrarlanır.
  act(Api.requestWithdrawal(amount, iban));
}

function resolveWithdrawal(id, outcome) {
  var note = null;
  if (outcome !== 'paid') {
    note = prompt('Ret gerekçesi (testçiye gösterilir):', 'IBAN bilgisi doğrulanamadı.');
    if (note === null) return;
  }
  act(Api.resolveWithdrawal(id, outcome, note));
}

// Sunum modunda giriş ekranını göstermek için oturumu kapatır.
// Oturum sunucudaki jetona bağlı olduğundan gerçekten çıkış yapılır.
function logoutForTour() {
  Api.logout();
  stopRevPolling();
  auth = { tab: "founder", mode: "login", error: "", email: "", pw: "" };
  return loadPublicState();
}

var tourState = null;

function startTour(key) {
  tourState = { key: key, step: 0 };
  runTourStepAction();
  renderTourOverlay();
}

function tourNext() {
  var t = TOURS[tourState.key];
  if (tourState.step < t.steps.length - 1) {
    tourState.step++;
    runTourStepAction();
    renderTourOverlay();
  } else {
    endTour();
  }
}

function tourPrev() {
  if (tourState.step > 0) {
    tourState.step--;
    runTourStepAction();
    renderTourOverlay();
  }
}

function runTourStepAction() {
  var step = TOURS[tourState.key].steps[tourState.step];
  if (step.action) step.action();
}

function endTour() {
  tourState = null;
  var el = document.getElementById("tour-overlay");
  if (el) el.remove();
}

function renderTourOverlay() {
  var t = TOURS[tourState.key];
  var step = t.steps[tourState.step];
  var existing = document.getElementById("tour-overlay");
  if (existing) existing.remove();

  var el = document.createElement("div");
  el.id = "tour-overlay";
  el.className = "tour-overlay";
  el.innerHTML =
    '<div class="tour-card">' +
      '<div class="tour-head"><span>' + esc(t.title) + " · " + (tourState.step + 1) + "/" + t.steps.length + '</span><button class="tour-close" onclick="endTour()" title="Turu kapat">✕</button></div>' +
      "<h3>" + esc(step.title) + "</h3>" +
      "<p>" + esc(step.body) + "</p>" +
      '<div class="tour-nav">' +
        (tourState.step > 0 ? '<button class="btn ghost sm" onclick="tourPrev()">← Geri</button>' : "<span></span>") +
        '<button class="btn primary sm" onclick="tourNext()">' + (tourState.step === t.steps.length - 1 ? "Bitir ✓" : "İleri →") + "</button>" +
      "</div>" +
    "</div>";
  document.body.appendChild(el);
}

/* ---------------- Başlat ---------------- */

// Açılış artık ağ üzerinden: elde geçerli bir JWT varsa tam state, yoksa redakte public
// state yüklenir. Token süresi dolmuşsa sessizce public state'e düşülür.
function boot() {
  var bootPublicId = publicIdFromHash();

  var loader = Api.isAuthed()
    ? loadState().catch(function () { Api.logout(); return loadPublicState(); })
    : loadPublicState();

  return loader.then(function () {
    if (bootPublicId) {
      // Paylaşılan profil bağlantısıyla açıldı — oturum aranmaz.
      route = { view: "publicProfile", param: bootPublicId };
    } else if (isLoggedIn()) {
      var booted = currentUser();
      route = { view: booted.role === "admin" ? "admin" : "dashboard", param: null };
      auth.tab = booted.role === "admin" ? "admin" : booted.role;
      startRevPolling();
    } else {
      route = { view: "login", param: null };
    }
    render();
  }, function (err) {
    document.getElementById("app").innerHTML =
      '<div style="max-width:520px;margin:80px auto;padding:28px;border:1px solid #e5e7eb;border-radius:12px;font-family:system-ui">' +
      "<h2>Sunucuya ulaşılamıyor</h2>" +
      "<p>Betakas API'si çalışmıyor olabilir. Sunucuyu başlatmak için:</p>" +
      '<pre style="background:#f6f7f9;padding:12px;border-radius:8px;overflow:auto">cd server\\Betakas.Api\ndotnet run</pre>' +
      "<p style=\"color:#6b7280;font-size:13px\">Hata: " + esc(err && err.message ? err.message : String(err)) + "</p></div>";
  });
}

boot();

// Geri/ileri tuşları ve elle yapıştırılan bağlantılar için hash'i dinle.

  if (hashLock) { hashLock = false; return; }

    route = { view: "publicProfile", param: id };

    window.scrollTo(0, 0);
  } else if (route.view === "publicProfile") {
    go(isLoggedIn() ? "dashboard" : "login", null, { back: true });
  }
});

if (document.addEventListener) {
  document.addEventListener("keydown", function (e) {
    if (e.altKey && e.key === "ArrowLeft") {

      goBack();
    }
