// S, oturum kapalıyken redakte public state'e döner; yükleme anında kısa süre null olabilir.
function getUser(id) { return S && S.users ? S.users.find(function (u) { return u.id === id; }) : undefined; }
function getRequest(id) { return S && S.requests ? S.requests.find(function (r) { return r.id === id; }) : undefined; }
function getSession(id) { return S && S.sessions ? S.sessions.find(function (s) { return s.id === id; }) : undefined; }
function currentUser() { return S ? getUser(S.authUserId) : undefined; }
function isLoggedIn() { return !!(S && S.authUserId && getUser(S.authUserId)); }

/* ---------------- Ürün kategorisi & testçi uzmanlığı ---------------- */

// Talebin ürün kategorisi. Eski kayıtlarda alan `category` adıyla ve farklı bir
// listeyle tutuluyordu; tanınmayan ya da eksik değerler "Diğer" sayılır.
function productCategoryOf(request) {
  var c = request && (request.productCategory || request.category);
  return PRODUCT_CATEGORIES.indexOf(c) !== -1 ? c : "Diğer";
}

// Testçinin uzmanlık kategorileri; eski kayıtlarda bu alan hiç yoktur.
function expertiseOf(user) {
  var list = (user && user.expertiseCategories) || [];
  return list.filter(function (c) { return PRODUCT_CATEGORIES.indexOf(c) !== -1; });
}

// Talep kullanıcının uzmanlık alanlarından biriyle eşleşiyorsa o kategoriyi döner.
function categoryMatch(user, request) {
  var cat = productCategoryOf(request);
  return expertiseOf(user).indexOf(cat) !== -1 ? cat : null;
}

// Testçinin "Diğer" için yazdığı serbest açıklama.
function expertiseOtherOf(user) {
  var list = (user && user.expertiseCategories) || [];
  if (list.indexOf(OTHER_CATEGORY) === -1) return "";
  return ((user && user.expertiseOther) || "").trim();
}

// Rozetlerde gösterilecek etiketler: "Diğer" seçiliyse yazdığı açıklamayla birlikte.
// Eşleştirme her zaman ham kategori adıyla yapılır, bu yalnızca görünüm içindir.
function expertiseLabels(user) {
  var other = expertiseOtherOf(user);
  return expertiseOf(user).map(function (c) {
    return c === OTHER_CATEGORY && other ? c + ": " + other : c;
  });
}

// Çoklu kategori seçici (kayıt formu ve profil aynı bileşeni kullanır).
// "Diğer" işaretlenince altında serbest metin alanı açılır.
function categoryPicker(cls, selected, otherText) {
  var hasOther = (selected || []).indexOf(OTHER_CATEGORY) !== -1;
  return '<div class="tag-row" style="margin-top:6px">' + PRODUCT_CATEGORIES.map(function (c) {
    return '<label class="tag" style="cursor:pointer;display:inline-flex;align-items:center;gap:6px">' +
      '<input type="checkbox" class="' + esc(cls) + '" value="' + esc(c) + '" style="width:auto;margin:0"' +
      (c === OTHER_CATEGORY ? ' onchange="toggleOtherField(\'' + esc(cls) + '\')"' : "") +
      ((selected || []).indexOf(c) !== -1 ? " checked" : "") + ">" + esc(c) + "</label>";
  }).join("") + "</div>" +
  '<div id="' + esc(cls) + '-other-wrap" style="margin-top:8px' + (hasOther ? "" : ";display:none") + '">' +
    '<input id="' + esc(cls) + '-other" maxlength="60" value="' + esc(otherText || "") + '" ' +
    'placeholder="Diğer olarak neyi kastediyorsun? (örn. Oyun, IoT, Masaüstü yazılım)">' +
  "</div>";
}

// "Diğer" kutusunun durumuna göre metin alanını aç/kapat.
function toggleOtherField(cls) {
  var wrap = document.getElementById(cls + "-other-wrap");
  if (!wrap) return;
  var on = false;
  Array.prototype.forEach.call(document.querySelectorAll("." + cls), function (el) {
    if (el.value === OTHER_CATEGORY && el.checked) on = true;
  });
  wrap.style.display = on ? "" : "none";
  if (on) {
    var field = document.getElementById(cls + "-other");
    if (field) field.focus();
  }
}

function pickedCategories(cls) {
  return Array.prototype.map.call(document.querySelectorAll("." + cls + ":checked"), function (el) {
    return el.value;
  });
}

function pickedOther(cls) {
  var field = document.getElementById(cls + "-other");
  return field ? (field.value || "").trim() : "";
}

// Kurucunun altyazısı startup'ıdır, testçininki uzmanlık başlığı.
function subtitleOf(u) { return (u.role === "tester" ? u.title : u.startup) || ""; }

var ROLE_LABEL = { founder: "Kurucu", tester: "Testçi", admin: "Yönetim" };

function findUserByEmail(email) {
  var e = String(email || "").trim().toLowerCase();
  return S.users.find(function (u) { return (u.email || "").toLowerCase() === e; });
}

// Testçi seviyesi: onaylanmış test sayısından türetilir (elle atanmaz).
/* ---------------- Testçi sıralaması & itibar rozeti ---------------- */

// Sıralama havuzu: en az bir testi onaylanmış herkes. Betakas'ta kurucular da
// takas için birbirinin ürününü test ettiğinden havuz role göre değil,
// tamamlanmış test sayısına göre kurulur; hiç test yapmamış hesap sıralanmaz.
function testerRanking() {
  var list = S.users.filter(function (u) {
    return u.status === "active" && u.role !== "admin" && reputation(u.id).completed > 0;
  }).map(function (u) {
    var rep = reputation(u.id);
    // Ortalama puan baskın; eşitliği tamamlanan test sayısı, cezalar ise negatif bozar.
    return { user: u, rep: rep, score: rep.avg * 100 + rep.completed - rep.penalties * 5 };
  }).sort(function (a, b) { return b.score - a.score; });

  // Eşit puanlılar aynı sırayı paylaşır (standart yarışma sıralaması).
  var position = 1;
  list.forEach(function (x, i) {
    if (i > 0 && x.score < list[i - 1].score) position = i + 1;
    x.position = position;
    x.total = list.length;
    x.pct = Math.max(1, Math.ceil((position / list.length) * 100));
  });
  return list;
}

function rankOf(userId) {
  var found = null;
  testerRanking().forEach(function (x) { if (x.user.id === userId) found = x; });
  return found;
}

// Rozet ölçütü yüzdelik dilim; havuz küçükken yüzde tek başına ayırt etmediği için
// sıra da kabul edilir. Her iki durumda da asgari puan eşiği aranır.
function reputationBadge(rank) {
  if (!rank) return null;
  var avg = rank.rep.avg;
  if ((rank.pct <= 10 || (rank.position === 1 && rank.total >= 3)) && avg >= 4.5) {
    return { label: "Top Testçi", cls: "credit" };
  }
  if ((rank.pct <= 25 || (rank.position <= 3 && rank.total >= 3)) && avg >= 4.0) {
    return { label: "Güvenilir Testçi", cls: "violet" };
  }
  return { label: "Aktif Testçi", cls: "cat" };
}

function testerLevel(userId) {
  var done = reputation(userId).completed;
  if (done >= 10) return { name: "Usta Testçi", next: null, done: done };
  if (done >= 5) return { name: "Uzman Testçi", next: 10, done: done };
  if (done >= 2) return { name: "Deneyimli Testçi", next: 5, done: done };
  return { name: "Çaylak Testçi", next: 2, done: done };
}

// Testçinin teslim ettiği ama henüz onaylanmamış testlerdeki bekleyen kazanç.
function pendingEarnings(userId) {
  var total = 0;
  S.sessions.forEach(function (s) {
    if (s.testerId !== userId) return;
    if (s.status !== "submitted" && s.status !== "disputed") return;
    var r = getRequest(s.requestId);
    if (r) total += r.credits;
  });
  return total;
}

// Testçinin bugüne kadar kazandığı toplam token (giden hareketler hariç).
function totalEarned(userId) {
  var total = 0;
  S.ledger.forEach(function (e) {
    if (e.to !== userId) return;
    if (e.type === "escrow_release" || e.type === "rep_bonus") total += e.amount;
  });
  return total;
}

function requestSessions(requestId) {
  return S.sessions.filter(function (s) { return s.requestId === requestId; });
}

// Dolu slot: onaylanan, teslim edilen ve kabul edilen oturumlar slot tüketir.
function slotsTaken(requestId) {
  return requestSessions(requestId).filter(function (s) {
    return s.status === "approved" || s.status === "submitted" || s.status === "accepted";
  }).length;
}

function slotsLeft(request) {
  return request.slots - slotsTaken(request.id);
}

function acctName(acct) {
  if (acct === "system") return "Sistem";
  if (acct === "escrow") return "Escrow (Bloke)";
  if (acct === "revenue") return "Platform Geliri";
  if (acct === "pool") return "Testçi Ödül Havuzu";
  if (acct === "bank") return "Banka (Dış Ödeme)";
  var u = getUser(acct);
  return u ? u.name : acct;
}

// ₺ biçimi: kuruş varsa gösterilir, yoksa gizlenir.
function fmtTRY(n) {
  var v = Math.round((n || 0) * 100) / 100;
  return "₺" + v.toLocaleString("tr-TR", { minimumFractionDigits: v % 1 ? 2 : 0, maximumFractionDigits: 2 });
}

/* ---------------- Ürün sürümleri ---------------- */

function getVersion(id) { return S.versions.find(function (v) { return v.id === id; }); }

// Bir kurucunun sürümleri — eskiden yeniye.
function versionsOf(userId) {
  return S.versions.filter(function (v) { return v.ownerId === userId; })
    .sort(function (a, b) { return a.createdAt - b.createdAt; });
}

function versionRequests(versionId) {
  return S.requests.filter(function (r) { return r.versionId === versionId; })
    .sort(function (a, b) { return b.createdAt - a.createdAt; });
}

// Sürüm durumu taleplerden türetilir: hiç talep yoksa taslak, açık talep varsa testte.
function versionStatus(versionId) {
  var rs = versionRequests(versionId);
  if (!rs.length) return { key: "draft", label: "Teste sokulmadı", cls: "" };
  if (rs.some(function (r) { return r.status === "open"; })) return { key: "testing", label: "Testte", cls: "cat" };
  return { key: "done", label: "Test tamamlandı", cls: "good" };
}

// Sürümün karnesi: kaç test, ortalama puan, "kullanırdım" oranı, tekrar eden bug temaları.
function versionStats(versionId) {
  var syn = synthesizeVersion(versionId);
  var rs = versionRequests(versionId);
  return {
    requests: rs.length,
    openRequests: rs.filter(function (r) { return r.status === "open"; }).length,
    tests: syn ? syn.testerCount : 0,
    avgRating: syn ? syn.avgRating : 0,
    wouldUsePct: syn ? syn.wouldUsePct : 0,
    avgDuration: syn ? syn.avgDuration : 0,
    bugThemes: syn ? syn.bugThemes : [],
    uxThemes: syn ? syn.uxThemes : [],
    // Aşamaya göre değişen alanlar: hangi anahtar geldiyse teması burada durur.
    themes: syn ? syn.themes : {},
    stages: syn ? syn.stages : {},
    dominantStage: syn ? syn.dominantStage : stageOfVersion(versionId),
    intentLabel: syn ? syn.intentLabel : FEEDBACK_TEMPLATES[stageOfVersion(versionId)].intentLabel,
    themeCount: function (key) { return ((syn && syn.themes[key]) || []).length; },
    syn: syn
  };
}

// Sürümün baskın aşaması taleplerinden türetilir (henüz test gelmemişse bile).
function stageOfVersion(versionId) {
  var counts = {};
  versionRequests(versionId).forEach(function (r) {
    var st = stageOf(r);
    counts[st] = (counts[st] || 0) + 1;
  });
  var best = -1, dominant = DEFAULT_STAGE;
  Object.keys(counts).forEach(function (st) { if (counts[st] > best) { best = counts[st]; dominant = st; } });
  return dominant;
}

// Sürüm karşılaştırmasında gösterilebilecek tema satırları. Yalnızca iki
// sürümden en az birinde veri olan alanlar satır olarak çizilir.
var THEME_COMPARE_ROWS = [
  { key: "bugs", label: "Tekrar eden bug teması" },
  { key: "ux", label: "Tekrar eden UX teması" },
  { key: "confusing", label: "Kafa karıştıran nokta teması" },
  { key: "dropOff", label: "Vazgeçme noktası teması" },
  { key: "missingFeature", label: "Eksik özellik teması" }
];

// İki sürümün tema sayılarını karşılaştıran satırlar (az olan iyidir).
function themeCompareRows(a, b) {
  return THEME_COMPARE_ROWS.map(function (row) {
    var an = a.themeCount(row.key), bn = b.themeCount(row.key);
    if (!an && !bn) return "";
    return compareRow(row.label, a.tests ? an : null, b.tests ? bn : null, { lowerIsBetter: true });
  }).join("");
}

// "v1.4" → sonraki yama (v1.5) ve sonraki ana sürüm (v2.0) önerisi.
function nextVersionLabels(label) {
  var m = /^v?(\d+)(?:\.(\d+))?/i.exec(label || "");
  if (!m) return { patch: "v1.1", major: "v2.0" };
  var major = parseInt(m[1], 10);
  var minor = m[2] === undefined ? 0 : parseInt(m[2], 10);
  return { patch: "v" + major + "." + (minor + 1), major: "v" + (major + 1) + ".0" };
}

// Bir testçinin bu ürünün önceki sürümlerinden hangilerini test ettiği (regresyon sinyali).
function testedEarlierVersions(userId, versionId) {
  var v = getVersion(versionId);
  if (!v) return [];
  return versionsOf(v.ownerId).filter(function (other) {
    if (other.id === versionId || other.createdAt >= v.createdAt) return false;
    var ids = versionRequests(other.id).map(function (r) { return r.id; });
    return S.sessions.some(function (s) {
      return s.testerId === userId && s.status === "accepted" && ids.indexOf(s.requestId) !== -1;
    });
  });
}

/* ---------------- Bug listesi & düzeltme takibi ---------------- */

// Kurucunun bir buga verebileceği yanıtlar. Sıra, seçicideki buton sırasıdır.
var FIX_STATES = {
  fixed:   { icon: "✅", label: "Düzeltildi" },
  wip:     { icon: "🔄", label: "Devam ediyor" },
  later:   { icon: "⏳", label: "Sonraki sürüme" },
  norepro: { icon: "❌", label: "Tekrarlanamadı" }
};
var FIX_ORDER = ["fixed", "wip", "later", "norepro"];

// "Bug görmedim" tarzı cümleler listeye madde olarak girmesin.
var NO_BUG_RE = /^(belirgin\s+)?(bir\s+)?(bug|hata|sorun|problem)\S*\s*(yok|görmedim|görmüyorum|yaşamadım|çıkmadı|rastlamadım)/i;

function pad2(n) { return n < 10 ? "0" + n : String(n); }

// Serbest metni tek tek bug maddelerine böler.
// "1) ... 2) ..." kalıbında yalnızca 1'den başlayıp sırayla artan numaralar bölme
// noktası sayılır; metnin içindeki "3. bölümde" gibi ifadeler madde sanılmaz.
function splitBugItems(text) {
  var t = (text || "").trim();
  if (!t) return [];

  var marks = [], want = 1, re = /(?:^|[\s;])(\d{1,2})\s*[)\.]\s+/g, m;
  while ((m = re.exec(t)) !== null) {
    if (parseInt(m[1], 10) !== want) continue;
    marks.push({ cut: m.index, start: m.index + m[0].length });
    want++;
  }

  var parts;
  if (marks.length) {
    parts = marks.map(function (mk, i) {
      return t.slice(mk.start, i + 1 < marks.length ? marks[i + 1].cut : t.length);
    });
  } else if (/(?:^|\n)\s*[-•*]\s+/.test(t)) {
    parts = t.split(/(?:^|\n)\s*[-•*]\s+/);
  } else {
    parts = t.split(/\n+/);
  }

  return parts
    .map(function (p) { return p.trim().replace(/^[,;]\s*/, ""); })
    .filter(function (p) { return p.length >= 8 && !NO_BUG_RE.test(p); });
}

// Bir sürüme gelen onaylı testlerden numaralanmış bug listesi.
// id'ler oturum id'sine bağlı olduğu için sayfa yenilense de değişmez —
// kurucunun işaretleri bu id'ler üzerinden saklanır.
function versionBugs(versionId) {
  var ids = versionRequests(versionId).map(function (r) { return r.id; });
  var sessions = S.sessions.filter(function (s) {
    return s.status === "accepted" && s.feedback && ids.indexOf(s.requestId) !== -1;
  }).sort(function (a, b) { return (a.submittedAt || 0) - (b.submittedAt || 0); });

  var out = [];
  sessions.forEach(function (s) {
    var tester = getUser(s.testerId);
    splitBugItems(s.feedback.bugs).forEach(function (text, i) {
      out.push({
        id: s.id + ":" + i,
        no: pad2(out.length + 1),
        text: text,
        reporter: tester ? tester.name : "Testçi",
        requestId: s.requestId,
        versionId: versionId,
        critical: /kritik|çöküyor|donuyor|donduruyor|veri kayb|çöktü/i.test(text)
      });
    });
  });
  return out;
}

function fixesOf(version) { return (version && version.fixes) || {}; }

// Bir sürümün yanıt verdiği bug kaynağı: kendisinden önceki, bug BİLDİRİLMİŞ en yeni sürüm.
// Doğrudan bir önceki sürüm değil — araya teste hiç sokulmamış bir sürüm girse bile
// açık kalan maddeler kaybolmasın diye geriye doğru bakılır.
function bugSourceFor(version) {
  if (!version) return null;
  var vers = versionsOf(version.ownerId);
  for (var i = vers.indexOf(version) - 1; i >= 0; i--) {
    if (versionBugs(vers[i].id).length) return vers[i];
  }
  return null;
}

// Kaynak sürümden itibaren `upTo` dahil tüm sürümlerin işaretlerini üst üste bindirir:
// sonraki sürümün işareti öncekini ezer, hiç dokunulmamışsa eski durum korunur.
// Böylece "v1.1'de düzelttim" bilgisi v1.2 notunda da görünür.
function accumulatedFixes(ownerId, source, upTo) {
  var vers = versionsOf(ownerId);
  var from = vers.indexOf(source) + 1;
  var to = upTo ? vers.indexOf(upTo) + 1 : vers.length;
  var state = {};
  vers.slice(from, to).forEach(function (v) {
    var f = fixesOf(v);
    Object.keys(f).forEach(function (k) { if (f[k]) state[k] = f[k]; });
  });
  return state;
}

// Sürüm notunun veri modeli: kaynak sürümün numaralı bug listesi + bu sürümdeki durumları.
function changelogOf(version) {
  var source = bugSourceFor(version);
  if (!source) return null;
  var bugs = versionBugs(source.id);
  if (!bugs.length) return null;

  var state = accumulatedFixes(version.ownerId, source, version);
  var rows = bugs.map(function (b) { return { bug: b, state: state[b.id] || null }; });
  return {
    source: source,
    rows: rows,
    total: rows.length,
    fixedCount: rows.filter(function (r) { return r.state === "fixed"; }).length,
    markedCount: rows.filter(function (r) { return r.state; }).length
  };
}

// Yeni sürüm formu için: kurucunun önünde duran, hâlâ kapanmamış maddeler.
// Kapatılmış (✅/❌) buglar listeye girmez; "devam ediyor"/"sonraki sürüme"
// denenler mevcut işaretiyle birlikte tekrar karşıya gelir.
function pendingBugs(ownerId) {
  var vers = versionsOf(ownerId);
  if (!vers.length) return null;
  var latest = vers[vers.length - 1];
  var source = versionBugs(latest.id).length ? latest : bugSourceFor(latest);
  if (!source) return null;

  var bugs = versionBugs(source.id);
  var state = accumulatedFixes(ownerId, source, null);
  var open = [], closed = 0;
  bugs.forEach(function (b) {
    var s = state[b.id] || null;
    if (s === "fixed" || s === "norepro") closed++;
    else open.push({ bug: b, state: s });
  });
  return { source: source, open: open, closed: closed, total: bugs.length };
}

// Demo verisi: sürümler önceki sürümün buglarına yanıt vermiş gibi işaretlenir.
// Yalnızca `fixes` hiç tanımlanmamış sürümlere dokunur; kurucunun kendi
// işaretlemesi (hiçbirini seçmemiş olsa bile) olduğu gibi kalır.
// Demo sürüm notu tikleri tohumlama sırasında sunucuda üretilir
// (SeedService.ApplyDemoFixesAsync); istemci bunları yalnızca görüntüler.

/* ----- Sürüm notu görünümleri ----- */

function fixBadge(state) {
  if (!state) return '<span class="fix-status none">⬜ Açık</span>';
  var f = FIX_STATES[state];
  return '<span class="fix-status ' + state + '">' + f.icon + " " + esc(f.label) + "</span>";
}

// prefix verilirse satır düzenlenebilir (tik seçici), verilmezse salt okunur rozet.
// canExport verilirse satıra GitHub / Jira kopyalama butonları eklenir.
function bugRow(bug, state, prefix, canExport) {
  return '<div class="bug-row' + (state === "fixed" ? " done" : "") + '">' +
    '<span class="no">#' + bug.no + "</span>" +
    '<span class="txt"><span class="body">' +
      (bug.critical ? '<span class="badge critical">kritik</span> ' : "") + esc(bug.text) +
    '</span><span class="who">' + esc(bug.reporter) + " bildirdi" +
      (canExport ? " · " + bugExportButtons(bug) : "") + "</span></span>" +
    (prefix ? fixPicker(bug.id, state, prefix) : fixBadge(state)) +
  "</div>";
}

/* ---------------- Bug dışa aktarma (kopyala-yapıştır) ---------------- */

var EXPORT_BTN_STYLE = "padding:1px 8px;font-size:11px;vertical-align:baseline";

function bugExportButtons(bug) {
  return '<span class="no-print">' +
    '<button type="button" class="btn ghost sm" style="' + EXPORT_BTN_STYLE +
      '" title="GitHub Issues formatında panoya kopyala" onclick="exportBug(\'' + esc(bug.id) + '\',\'github\')">GitHub</button> ' +
    '<button type="button" class="btn ghost sm" style="' + EXPORT_BTN_STYLE +
      '" title="Jira wiki markup formatında panoya kopyala" onclick="exportBug(\'' + esc(bug.id) + '\',\'jira\')">Jira</button>' +
  "</span>";
}

// Bug metninin ilk cümlesi issue başlığı olur; tamamı açıklamada kalır.
function bugTitle(bug) {
  var t = (bug.text || "").trim();
  var m = /^(.{10,80}?)[.!?](\s|$)/.exec(t);
  var title = m ? m[1] : t;
  if (title.length > 80) title = title.slice(0, 77).replace(/\s+\S*$/, "") + "…";
  return title;
}

// Bug id'si oturuma bağlıdır; numarayı ve sürümü versionBugs'tan tazeleyerek buluruz.
function findBug(bugId) {
  var s = getSession(String(bugId).split(":")[0]);
  if (!s) return null;
  var r = getRequest(s.requestId);
  if (!r || !r.versionId) return null;
  var list = versionBugs(r.versionId);
  for (var i = 0; i < list.length; i++) {
    if (list[i].id === bugId) return list[i];
  }
  return null;
}

// Bir bugun kaynak künyesi: sürüm etiketi · sıra no · bildiren.
function bugSourceLine(bug) {
  var v = getVersion(bug.versionId);
  return (v ? v.label : "sürüm bilinmiyor") + " · #" + bug.no + " · " + bug.reporter + " bildirdi";
}

function bugExportText(bug, format) {
  if (format === "jira") {
    return "h2. [Bug] " + bugTitle(bug) + "\n\n" +
      "*Kaynak:* Betakas test talebi — " + bugSourceLine(bug) + "\n" +
      "*Öncelik:* " + (bug.critical ? "Highest" : "Medium") + "\n\n" +
      bug.text;
  }
  return "## [Bug] " + bugTitle(bug) + "\n\n" +
    "**Kaynak:** Betakas test talebi — " + bugSourceLine(bug) + "\n\n" +
    bug.text;
}

function exportBug(bugId, format) {
  var bug = findBug(bugId);
  if (!bug) { toast("Bug bulunamadı — sayfayı yenileyip tekrar dene.", "bad"); return; }
  copyToClipboard(bugExportText(bug, format),
    "#" + bug.no + " <strong>" + (format === "jira" ? "Jira" : "GitHub Issues") +
    "</strong> formatında panoya kopyalandı ✓ Yeni issue açıp yapıştırabilirsin.");
}

// Sürümde hâlâ kapatılmamış buglar: sonraki sürümlerde ✅ ya da ❌ işaretlenmemiş olanlar.
function openBugsOf(versionId) {
  var v = getVersion(versionId);
  if (!v) return [];
  var state = accumulatedFixes(v.ownerId, v, null);
  return versionBugs(versionId).filter(function (b) {
    return state[b.id] !== "fixed" && state[b.id] !== "norepro";
  });
}

function exportOpenBugs(versionId) {
  var v = getVersion(versionId);
  if (!v) return;
  var bugs = openBugsOf(versionId);
  if (!bugs.length) { toast("Bu sürümde açık bug kalmadı.", "warn"); return; }

  var owner = getUser(v.ownerId);
  var lines = ["# " + subtitleOf(owner) + " " + v.label + " — açık buglar (" + bugs.length + ")", "",
    "_Kaynak: Betakas test talebi · " + fmtDate(v.createdAt) + "_", ""];
  bugs.forEach(function (b) {
    lines.push("- [ ] **#" + b.no + "**" + (b.critical ? " `kritik`" : "") + " " + b.text +
      " — _" + b.reporter + "_");
  });
  copyToClipboard(lines.join("\n"),
    "<strong>" + bugs.length + " açık bug</strong> Markdown listesi olarak panoya kopyalandı ✓");
}

function fixPicker(bugId, state, prefix) {
  return '<span class="fixpick" data-bug="' + esc(bugId) + '" data-prefix="' + esc(prefix) + '">' +
    FIX_ORDER.map(function (k) {
      return '<button type="button" class="fx' + (state === k ? " active" : "") + '" data-v="' + k +
        '" title="' + esc(FIX_STATES[k].label) + '" onclick="pickFix(this)">' + FIX_STATES[k].icon + "</button>";
    }).join("") + "</span>";
}

// Tek seçim; aynı butona tekrar basmak işareti kaldırır.
function pickFix(btn) {
  var wrap = btn.parentNode;
  var wasActive = btn.classList.contains("active");
  Array.prototype.forEach.call(wrap.querySelectorAll(".fx"), function (b) { b.classList.remove("active"); });
  if (!wasActive) btn.classList.add("active");
  var row = wrap.closest(".bug-row");
  if (row) row.classList.toggle("done", !wasActive && btn.getAttribute("data-v") === "fixed");
}

function markAllFixed(prefix) {
  var picks = document.querySelectorAll('.fixpick[data-prefix="' + prefix + '"]');
  Array.prototype.forEach.call(picks, function (wrap) {
    Array.prototype.forEach.call(wrap.querySelectorAll(".fx"), function (b) {
      b.classList.toggle("active", b.getAttribute("data-v") === "fixed");
    });
    var row = wrap.closest(".bug-row");
    if (row) row.classList.add("done");
  });
  toast(picks.length + " bug <strong>Düzeltildi</strong> işaretlendi.", "good");
}

// Ekrandaki işaretleri { bugId: durum } olarak toplar.
function collectFixes(prefix) {
  var out = {};
  Array.prototype.forEach.call(document.querySelectorAll('.fixpick[data-prefix="' + prefix + '"]'), function (wrap) {
    var on = wrap.querySelector(".fx.active");
    if (on) out[wrap.getAttribute("data-bug")] = on.getAttribute("data-v");
  });
  return out;
}

function changelogSummary(cl) {
  var pct = cl.total ? Math.round(cl.fixedCount / cl.total * 100) : 0;
  return '<div class="fix-summary">' +
    '<span><b style="color:var(--good)">' + cl.fixedCount + "</b> / " + cl.total + " bug düzeltildi</span>" +
    '<span class="fix-bar"><span style="width:' + pct + '%"></span></span>' +
    "<span><b>%" + pct + "</b></span>" +
    (cl.markedCount < cl.total ? '<span class="fix-status none">' + (cl.total - cl.markedCount) + " madde işaretlenmedi</span>" : "") +
  "</div>";
}

function changelogTable(cl) {
  return '<div style="overflow-x:auto"><table><thead><tr>' +
      '<th class="num" style="width:46px">#</th><th style="width:130px">Bildiren</th><th>Bug</th><th style="width:160px">Durum</th>' +
    "</tr></thead><tbody>" +
    cl.rows.map(function (r) {
      return "<tr><td class=\"num\"><b>" + r.bug.no + "</b></td>" +
        "<td>" + esc(r.bug.reporter) + "</td>" +
        "<td>" + (r.bug.critical ? '<span class="badge critical">kritik</span> ' : "") + esc(r.bug.text) + "</td>" +
        "<td>" + fixBadge(r.state) + "</td></tr>";
    }).join("") + "</tbody></table></div>";
}

var FIX_LEGEND = '<div class="fix-legend"><strong>Durum anahtarı:</strong> ' +
  FIX_ORDER.map(function (k) { return FIX_STATES[k].icon + " " + FIX_STATES[k].label; }).join(" · ") + "</div>";

/* ----- Sürüm notunu dışa aktar ----- */

// Discord/forum/README'ye yapıştırılabilir markdown sürüm notu.
function changelogText(versionId) {
  var v = getVersion(versionId);
  if (!v) return "";
  var owner = getUser(v.ownerId);
  var cl = changelogOf(v);
  var lines = ["# " + subtitleOf(owner) + " — " + v.label + " Sürüm Notları", "", v.notes, ""];

  if (cl) {
    lines.push("## " + cl.source.label + " testlerinde bildirilen buglar", "");
    lines.push("| # | Bildiren | Bug | Durum |", "|---|---|---|---|");
    cl.rows.forEach(function (r) {
      var f = r.state ? FIX_STATES[r.state].icon + " " + FIX_STATES[r.state].label : "⬜ Açık";
      lines.push("| " + r.bug.no + " | " + r.bug.reporter + " | " + r.bug.text.replace(/\|/g, "/") + " | " + f + " |");
    });
    lines.push("", "**" + cl.fixedCount + " / " + cl.total + " bug düzeltildi.**", "");
    lines.push("Durum anahtarı: " + FIX_ORDER.map(function (k) {
      return FIX_STATES[k].icon + " " + FIX_STATES[k].label;
    }).join(" · "));
  }
  return lines.join("\n");
}

function copyChangelog(versionId) {
  copyToClipboard(changelogText(versionId), "Sürüm notu panoya kopyalandı ✓ Markdown olarak yapıştırabilirsin.");
}

// Panoya yaz; file:// üzerinde pano API'si engellenebildiği için eski yönteme düşer.
function copyToClipboard(text, okMsg) {
  var ok = function () { toast(okMsg, "good"); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(ok, function () { copyFallback(text, ok); });
  } else {
    copyFallback(text, ok);
  }
}

function copyFallback(text, ok) {
  var ta = document.createElement("textarea");
  ta.value = text;
  ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); ok(); }
  catch (e) { toast("Kopyalanamadı — metni elle seçip kopyalaman gerekiyor.", "bad"); }
  document.body.removeChild(ta);
}

function saveFixes(versionId) {
  var v = getVersion(versionId);
  if (!v) return;
  act(Api.saveFixes(versionId, collectFixes("ed")));
}

/* ---------------- Sentez Raporu (kural tabanlı, AI yok) ---------------- */

var TR_STOPWORDS = ["ve", "ile", "bir", "bu", "şu", "ama", "fakat", "ancak", "için", "gibi", "kadar",
  "daha", "çok", "her", "hiç", "olan", "oldu", "olarak", "var", "yok", "ise", "göre", "sonra", "önce",
  "içinde", "üzerinde", "altında", "arasında", "beni", "beri", "belki", "bazı", "tüm", "kendi", "diye",
  "değil", "the", "and", "or", "for", "with", "that", "this", "have", "were", "when", "where"];

function tokenize(text) {
  return (text || "").toLowerCase()
    .replace(/[^\wşçöğüıi̇\s]/gi, " ")
    .split(/\s+/)
    .filter(function (w) { return w.length >= 4 && TR_STOPWORDS.indexOf(w) === -1; });
}

// Bir kelimeyi kaç FARKLI testçinin kullandığını sayar (aynı testçinin kendi
// metninde bir kelimeyi tekrar etmesi yanlışlıkla "ortak tema" saymasın diye).
function topKeywords(texts, limit) {
  var freq = {};
  texts.forEach(function (t) {
    var seen = {};
    tokenize(t).forEach(function (w) {
      if (seen[w]) return;
      seen[w] = true;
      freq[w] = (freq[w] || 0) + 1;
    });
  });
  return Object.keys(freq)
    .map(function (w) { return { word: w, count: freq[w] }; })
    .filter(function (x) { return x.count >= 2; })
    .sort(function (a, b) { return b.count - a.count; })
    .slice(0, limit || 8);
}

// Bir talebe gelen tüm onaylı feedback'lerin otomatik özeti: ortak temalar + istatistikler.
function synthesizeRequest(requestId) {
  return synthesize(requestSessions(requestId));
}

// Bir sürümün tüm taleplerindeki onaylı feedback'lerin birleşik özeti (sürüm karnesi).
function synthesizeVersion(versionId) {
  var ids = versionRequests(versionId).map(function (r) { return r.id; });
  return synthesize(S.sessions.filter(function (s) { return ids.indexOf(s.requestId) !== -1; }));
}

// Talebin ürün aşaması; alan yoksa (eski kayıt) MVP sayılır.
function stageOf(request) {
  var st = request && request.stage;
  return PRODUCT_STAGES.indexOf(st) !== -1 ? st : DEFAULT_STAGE;
}

function templateOf(request) { return FEEDBACK_TEMPLATES[stageOf(request)]; }

// Bir feedback alanının insan okunur başlığı — hangi aşamadan gelirse gelsin bulunur.
function fieldLabel(key) {
  var found = key;
  PRODUCT_STAGES.forEach(function (st) {
    FEEDBACK_TEMPLATES[st].fields.forEach(function (f) { if (f.key === key) found = f.label; });
  });
  return found;
}

// Metin alanı olan tüm feedback anahtarları (choice alanları hariç).
function allFieldKeys() {
  var keys = [];
  PRODUCT_STAGES.forEach(function (st) {
    FEEDBACK_TEMPLATES[st].fields.forEach(function (f) {
      if (keys.indexOf(f.key) === -1) keys.push(f.key);
    });
  });
  return keys;
}

function synthesize(allSessions) {
  var sessions = allSessions.filter(function (s) {
    return s.status === "accepted" && s.feedback;
  });
  if (!sessions.length) return null;

  var ratingSum = 0, durSum = 0;
  var wu = { evet: 0, belki: 0, hayir: 0 };
  var texts = {};   // alan anahtarı → metinler
  var stages = {};  // aşama → kaç test

  sessions.forEach(function (s) {
    ratingSum += s.rating || 0;
    durSum += s.durationMin || 0;
    if (s.feedback.wouldUse && wu.hasOwnProperty(s.feedback.wouldUse)) wu[s.feedback.wouldUse]++;
    var st = stageOf(getRequest(s.requestId));
    stages[st] = (stages[st] || 0) + 1;
    // Aşamalar farklı alanlar doldurur; hangi anahtar geldiyse onu topla.
    Object.keys(s.feedback).forEach(function (k) {
      if (k === "wouldUse" || k === "wouldUseWhy") return;
      if (typeof s.feedback[k] !== "string") return;
      (texts[k] = texts[k] || []).push(s.feedback[k]);
    });
  });

  var themes = {};
  Object.keys(texts).forEach(function (k) { themes[k] = topKeywords(texts[k], 6); });

  // Baskın aşama: en çok testin geldiği aşama (etiketler buna göre yazılır).
  var dominant = DEFAULT_STAGE, best = -1;
  Object.keys(stages).forEach(function (st) { if (stages[st] > best) { best = stages[st]; dominant = st; } });

  return {
    testerCount: sessions.length,
    avgRating: ratingSum / sessions.length,
    avgDuration: Math.round(durSum / sessions.length),
    wouldUse: wu,
    wouldUsePct: Math.round((wu.evet / sessions.length) * 100),
    stages: stages,
    dominantStage: dominant,
    intentLabel: FEEDBACK_TEMPLATES[dominant].intentLabel,
    themes: themes,
    // Geriye dönük alanlar: mevcut ekranlar bunları okumaya devam eder.
    bugThemes: themes.bugs || [],
    uxThemes: themes.ux || [],
    impressionThemes: themes.firstImpression || []
  };
}

/* ---------------- Şüpheli puanlama deseni tespiti (sybil / danışıklı puan) ---------------- */

// İki kullanıcı karşılıklı olarak birbirine sürekli yüksek puan veriyorsa işaretle.
function detectCollusionPairs() {
  function key(a, b) { return a < b ? a + "|" + b : b + "|" + a; }
  var pairs = {};

  S.sessions.forEach(function (s) {
    if (s.status !== "accepted" || !s.rating) return;
    var r = getRequest(s.requestId);
    if (!r || r.ownerId === s.testerId) return;
    var owner = r.ownerId, tester = s.testerId;
    var a = owner < tester ? owner : tester;
    var b = owner < tester ? tester : owner;
    var k = key(owner, tester);
    if (!pairs[k]) pairs[k] = { a: a, b: b, aRatesB: [], bRatesA: [] };
    if (owner === a) pairs[k].aRatesB.push(s.rating); else pairs[k].bRatesA.push(s.rating);
  });

  var flagged = [];
  Object.keys(pairs).forEach(function (k) {
    var p = pairs[k];
    if (!p.aRatesB.length || !p.bRatesA.length) return; // tek yönlü ilişki risk değil
    var avgA = p.aRatesB.reduce(function (s, x) { return s + x; }, 0) / p.aRatesB.length;
    var avgB = p.bRatesA.reduce(function (s, x) { return s + x; }, 0) / p.bRatesA.length;
    if (avgA >= 4.5 && avgB >= 4.5) {
      var total = p.aRatesB.length + p.bRatesA.length;
      flagged.push({ userA: p.a, userB: p.b, avgA: avgA, avgB: avgB, total: total, risk: total >= 4 ? "high" : "watch" });
    }
  });
  return flagged.sort(function (a, b) { return b.total - a.total; });
}

function esc(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function fmtDate(ts) {
  var d = new Date(ts);
  return d.toLocaleDateString("tr-TR", { day: "numeric", month: "short" }) + " " +
         d.toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });
}

function timeAgo(ts) {
  var m = Math.round((Date.now() - ts) / 60000);
  if (m < 60) return m + " dk önce";
  var h = Math.round(m / 60);
  if (h < 24) return h + " saat önce";
  return Math.round(h / 24) + " gün önce";
}

function starStr(n) {
  var out = "";
  for (var i = 1; i <= 5; i++) out += i <= Math.round(n) ? "★" : "☆";
  return out;
}

// (Giriş ekranı geçmişe yazılmaz — çıkış yapınca geriye dönülecek bir yer kalmaz.)
var navStack = [];
var NAV_STACK_LIMIT = 50;

function go(view, param, opts) {
  var back = opts && opts.back;
  var same = route.view === view && (route.param || null) === (param || null);
  if (!back && !same && route.view && route.view !== "login") {
    navStack.push({ view: route.view, param: route.param });
    if (navStack.length > NAV_STACK_LIMIT) navStack.shift();
  }
  route = { view: view, param: param || null };
  syncHash();
  render();
  window.scrollTo(0, 0);
}

// Public profil, adres çubuğundaki hash ile taşınır: kopyalanan link başka bir
// tarayıcıda/sekmede açıldığında da doğrudan o profile düşer.
function publicProfileUrl(userId) {
  return window.location.origin + window.location.pathname + window.location.search + "#/t/" + userId;
}

function publicIdFromHash() {
  var m = /^#\/t\/([A-Za-z0-9_-]+)$/.exec(window.location.hash || "");
  return m ? m[1] : null;
}

var hashLock = false; // hash'i kendimiz yazarken hashchange olayını yok say

function syncHash() {
  var want = route.view === "publicProfile" && route.param ? "#/t/" + route.param : "";
  var now = (window.location.hash || "").replace(/^#$/, "");
  if (now === want) return;
  hashLock = true;
  window.location.hash = want;
}

function openPublicProfile(userId) { go("publicProfile", userId); }

function goBack() {
  if (!navStack.length) return;
  var prev = navStack.pop();
  go(prev.view, prev.param, { back: true });
}

// Hesap değişimi, giriş/çıkış ve sıfırlamada geçmiş anlamını yitirir.
function clearNav() { navStack = []; }

function backButton(cls) {
  if (!navStack.length) return "";
  return '<button class="btn ghost sm no-print" onclick="goBack()" title="Önceki ekrana dön (Alt + ←)">← Geri</button>';

  if (me.role === "tester") return ["dashboard", "discover", "tasks", "ledger", "radar", "profile", "request", "version"].indexOf(view) !== -1;
  return ["dashboard", "discover", "versions", "version", "newRequest", "buyTokens", "ledger", "radar", "profile", "request"].indexOf(view) !== -1;

    admin: viewAdmin,

  auth.mode = "login";
  auth.error = "";
  render();
}

}

function fillDemo(userId) {
  // E-posta demo kartı yükünden okunur: public state'te kullanıcı e-postaları redakte edilir.
  var u = (S && S.demoAccounts ? S.demoAccounts : []).filter(function (x) { return x.id === userId; })[0];
  if (!u) return;
  auth.email = u.email;
  auth.pw = DEMO_PASSWORD;
  auth.error = "";
  render();
  var btn = document.querySelector(".auth-form .btn.primary");
  if (btn) btn.focus();
}

function doLogin() {
  captureAuthInputs();
  auth.error = "";

  var email = (auth.email || "").trim();
  var pw = auth.pw || "";
  if (!email || !pw) { auth.error = "E-posta ve şifre zorunlu."; render(); return; }

  // Kimlik doğrulama sunucuda yapılır; parola hash'i tarayıcıya hiç inmez.
  auth.busy = true;
  render();

  Api.login(email, pw, auth.tab).then(function (res) {
    auth.busy = false;
    var u = res.user;
    return loadState().then(function () {
      auth.pw = "";
      auth.error = "";
      clearNav();
      route = { view: u.role === "admin" ? "admin" : "dashboard", param: null };
      startRevPolling();
      render();
      window.scrollTo(0, 0);
      toast("Hoş geldin <strong>" + esc(u.name.split(" ")[0]) + "</strong> · " + (ROLE_LABEL[u.role] || "") + " olarak giriş yaptın.", "good");
    });
  }, function (err) {
    auth.busy = false;
    // Sunucu "yanlış sekme" durumunu ayrı işaretler: doğru sekmeye geçirip tekrar denetiriz.
    if (err.data && err.data.error === "wrong-tab" && err.data.role) {
      auth.tab = err.data.role;
      auth.error = "Bu hesap bir " + (ROLE_LABEL[err.data.role] || err.data.role) + " hesabı. Doğru sekmeye geçirdik, tekrar dene.";
    } else {
      auth.error = err.message || "Giriş başarısız.";
    }
    render();
  });
}

function doRegister() {
  var name = (document.getElementById("rg-name").value || "").trim();
  var email = (document.getElementById("rg-email").value || "").trim();
  var org = (document.getElementById("rg-org").value || "").trim();
  var tagline = (document.getElementById("rg-tagline").value || "").trim();
  var sectorEl = document.getElementById("rg-sector");
  var expertise = pickedCategories("rg-exp");
  var expertiseOther = pickedOther("rg-exp");

  var pwEl = document.getElementById("rg-pw");
  var pw = pwEl ? pwEl.value || "" : "";

  if (!name || !email || !org || !tagline) { auth.error = "Tüm zorunlu alanları doldur."; render(); return; }
  if (email.indexOf("@") < 1) { auth.error = "Geçerli bir e-posta gir."; render(); return; }
  if (pw.length < 6) { auth.error = "Şifre en az 6 karakter olmalı."; render(); return; }
  if (auth.tab === "tester" && !expertise.length) { auth.error = "En az bir uzmanlık alanı seç."; render(); return; }
  if (expertise.indexOf(OTHER_CATEGORY) !== -1 && !expertiseOther) {
    auth.error = "\"Diğer\" seçtin — hangi alanı kastettiğini yaz."; render(); return;
  }

  // E-posta tekilliği ve hesap oluşturma sunucuda yapılır (kayıt uçtan uca /api/auth/register).
  auth.busy = true;
  render();

  Api.register({
    name: name, email: email, password: pw, role: auth.tab,
    org: org, tagline: tagline,
    sector: auth.tab === "founder" ? (sectorEl ? sectorEl.value : "Diğer") : null,
    expertiseCategories: expertise, expertiseOther: expertiseOther
  }).then(function () {
    auth.busy = false;
    auth.mode = "login";
    auth.email = email;
    auth.pw = "";
    auth.error = "";
    render();
    toast("Başvurun alındı ✓ Yönetim onayladıktan sonra giriş yapabilirsin (demo: Yönetim panelinden onayla).", "good");
  }, function (err) {
    auth.busy = false;
    auth.error = err.message || "Başvuru gönderilemedi.";
    render();
  });
}

function logout() {
  var me = currentUser();

  stopRevPolling();
  endTour();
  clearNav();

  loadPublicState().then(function () {
    render();
    window.scrollTo(0, 0);
    toast("Oturum kapatıldı.", "warn");
  });
}

function viewDashboard() {
  var me = currentUser();
  if (me.role === "admin") return viewAdmin();
  if (me.role === "tester") return viewTesterDashboard();

  var rep = reputation(me.id);
  var mult = repMultiplier(me.id);
  var myRequests = S.requests.filter(function (r) { return r.ownerId === me.id && r.status === "open"; });
  var myTasks = S.sessions.filter(function (s) {
    return s.testerId === me.id && (s.status === "applied" || s.status === "approved");
  });
  var waiting = S.sessions.filter(function (s) {
    var r = getRequest(s.requestId);
    return r.ownerId === me.id && s.status === "submitted";
  });

  var html = '<div class="page-head"><h1>Merhaba, ' + esc(me.name.split(" ")[0]) + "</h1>" +
    '<div class="sub">' + esc(me.startup) + " · " + esc(me.tagline) + "</div></div>";

  // Stat kutuları
  var myTokens = balance(me.id);
  html += '<div class="section"><div class="tiles">' +
    '<div class="tile accent"><div class="label">Kullanılabilir Token</div><div class="value">' + myTokens + '</div><div class="hint">≈ ' + Math.floor(myTokens / TOKENS_PER_TEST) + " test · " + fmtTRY(myTokens * tokenPrice()) + " değerinde</div></div>" +
    '<div class="tile warn"><div class="label">Escrow\'da Bloke</div><div class="value">' + blockedFor(me.id) + '</div><div class="hint">açık taleplerin için</div></div>' +
    '<div class="tile"><div class="label">İtibar</div><div class="value">' + (rep.count ? rep.avg.toFixed(1) : "—") + '</div><div class="hint">' + (rep.count ? '<span class="star-static">' + starStr(rep.avg) + "</span> · çarpan " + mult + "×" : "henüz test yok") + "</div></div>" +
    '<div class="tile"><div class="label">Tamamlanan Test</div><div class="value">' + rep.completed + '</div><div class="hint">' + (rep.penalties ? rep.penalties + " kaybedilen itiraz cezası" : "onaylanmış feedback") + "</div></div>" +
  "</div></div>";

  // Token uyarısı / satın alma çağrısı
  if (myTokens < TOKENS_PER_TEST) {
    html += '<div class="notice">Bakiyen bir test açmaya yetmiyor (' + myTokens + " token). " +
      "Başka bir kurucunun ürününü test ederek token kazanabilir ya da " +
      '<a href="javascript:go(\'buyTokens\')">token paketi satın alabilirsin</a> — ' + TOKEN_PACKAGES[0].testers +
      " testçilik paket " + fmtTRY(packagePrice(TOKEN_PACKAGES[0])) + ".</div>";

  // Onay bekleyen feedback'ler (talep sahibi olarak)
  if (waiting.length) {
    html += '<div class="section"><h2>Onay Bekleyen Feedback\'ler</h2><div class="card">' +
      waiting.map(function (s) {
        var r = getRequest(s.requestId);
        var t = getUser(s.testerId);
        return '<div class="row-item">' + avatar(t) +
          '<div class="grow"><div class="title">' + esc(t.name) + " → " + esc(r.title) + '</div>' +
          '<div class="meta">' + timeAgo(s.submittedAt) + " teslim edildi · 72 saat içinde yanıtlamazsan otomatik onaylanır</div></div>" +
          '<button class="btn primary sm" onclick="go(\'request\',\'' + r.id + '\')">İncele & Puanla</button></div>';
      }).join("") + "</div></div>";
  }

  // Üzerimdeki testler
  html += '<div class="section"><h2>Üzerimdeki Testler</h2><div class="card">';
  if (myTasks.length) {
    html += myTasks.map(function (s) {
      var r = getRequest(s.requestId);
      var o = getUser(r.ownerId);
      return '<div class="row-item">' + avatar(o) +

        statusBadge(s.status) +

  } else {
    html += '<div class="empty">Şu an üzerinde test yok. <a href="javascript:go(\'discover\')">Keşfet</a>\'ten bir ürün seç, test et, token kazan.</div>';
  }
  html += "</div></div>";

  // Taleplerim
  html += '<div class="section"><h2>Açık Taleplerim</h2><div class="card">';
  if (myRequests.length) {
    html += myRequests.map(function (r) {

  // Ürün sürümleri — son sürümün karnesi ve bir sonraki sürüm çağrısı

    var prevStats2 = prevV ? versionStats(prevV.id) : null;
    html += '<div class="row-item"><div class="grow"><div class="title">' + verBadge(last, true) + " " + esc(versionStatus(last.id).label) + "</div>" +
      '<div class="meta">' + lastStats.tests + " onaylı test" +
      (lastStats.tests ? " · ort. " + lastStats.avgRating.toFixed(1) + "★ · %" + lastStats.wouldUsePct + " kullanırdım" : " — henüz geri bildirim yok") +
      (prevStats2 && prevStats2.tests && lastStats.tests
        ? " · " + esc(prevV.label) + "'e göre " + deltaTag(Math.round(lastStats.avgRating * 10) / 10, Math.round(prevStats2.avgRating * 10) / 10)
        : "") + "</div></div>" +
      '<button class="btn sm" onclick="go(\'version\',\'' + last.id + '\')">Karne</button>' +
      '<button class="btn primary sm" onclick="go(\'versions\')">Yeni Sürüm</button></div>';
  } else {
    html += '<div class="empty">Henüz ürün sürümü yok. <a href="javascript:go(\'versions\')">İlk sürümünü oluştur</a> ve teste sok.</div>';

  // Son token hareketleri
  var myLedger = S.ledger.filter(function (e) { return e.from === me.id || e.to === me.id; }).slice(-4).reverse();
  if (myLedger.length) {
    html += '<div class="section"><h2>Son Token Hareketleri</h2><div class="card">' +
      myLedger.map(function (e) {
        var incoming = e.to === me.id;

      }).join("") +
      '</div><div style="margin-top:10px"><button class="btn ghost sm" onclick="go(\'ledger\')">Tüm defteri gör →</button></div></div>';
  }

  return html;
}

/* ---------------- Ürün Sürümleri (kurucu) ---------------- */

function verBadge(v, isLatest) {
  return '<span class="ver-badge' + (isLatest ? " latest" : "") + '">' + esc(v.label) + "</span>";
}

// İki sayının farkını ok + renk ile gösterir (yüksek daha iyi ya da tersi).
function deltaTag(now, before, opts) {
  opts = opts || {};
  // Taraflardan biri ölçülmemişse (henüz test yok) karşılaştırma yapılmaz.
  if (now === null || now === undefined || before === null || before === undefined) return '<span class="delta flat">—</span>';
  if (!before && !now) return '<span class="delta flat">—</span>';
  var d = Math.round((now - before) * 10) / 10;
  if (!d) return '<span class="delta flat">±0</span>';
  var better = opts.lowerIsBetter ? d < 0 : d > 0;
  return '<span class="delta ' + (better ? "up" : "down") + '">' + (d > 0 ? "▲ +" : "▼ ") + d + (opts.suffix || "") + "</span>";
}

function compareRow(label, a, b, opts) {
  opts = opts || {};
  var fmt = opts.fmt || function (x) { return x; };
  return '<div class="compare-row"><span class="k">' + esc(label) + "</span>" +
    '<span class="a">' + (a === null ? "—" : fmt(a)) + "</span>" +
    '<span class="b">' + (b === null ? "—" : fmt(b)) + "</span>" +
    "<span>" + deltaTag(b, a, opts) + "</span></div>";
}

function viewVersions() {
  var me = currentUser();
  var vers = versionsOf(me.id);
  var latest = vers.length ? vers[vers.length - 1] : null;
  var prev = vers.length > 1 ? vers[vers.length - 2] : null;

  var html = '<div class="page-head"><h1>Ürün Sürümleri</h1>' +
    '<div class="sub">Ürününün her sürümünü ayrı ayrı teste sok; testçilerin verdiği puanların ve temaların sürümden sürüme nasıl değiştiğini gör.</div></div>';

  // Son iki sürümün karşılaştırması
  if (latest && prev) {
    var a = versionStats(prev.id), b = versionStats(latest.id);
    html += '<div class="section"><h2>Sürüm Karşılaştırması</h2><div class="card">' +
      '<div class="compare">' +
        '<div class="side"><div class="cap">Önceki</div>' + verBadge(prev) +
          '<div style="font-size:12.5px;color:var(--muted);margin-top:6px">' + a.tests + " onaylı test</div></div>" +
        '<div class="arrow">→</div>' +
        '<div class="side"><div class="cap">Güncel</div>' + verBadge(latest, true) +
          '<div style="font-size:12.5px;color:var(--muted);margin-top:6px">' + b.tests + " onaylı test</div></div>" +
      "</div>" +
      '<div class="compare-rows">' +
        compareRow("Ortalama puan", a.tests ? Math.round(a.avgRating * 10) / 10 : null, b.tests ? Math.round(b.avgRating * 10) / 10 : null) +
        compareRow("\"" + b.intentLabel + "\" oranı", a.tests ? a.wouldUsePct : null, b.tests ? b.wouldUsePct : null, { suffix: " puan", fmt: function (x) { return "%" + x; } }) +
        compareRow("Ortalama test süresi", a.tests ? a.avgDuration : null, b.tests ? b.avgDuration : null, { suffix: " dk", fmt: function (x) { return x + " dk"; } }) +
        themeCompareRows(a, b) +
      "</div>" +
      (b.tests
        ? ""
        : '<div class="notice" style="margin:14px 0 0"><strong>' + esc(latest.label) + "</strong> için henüz onaylı test yok. " +
          "Karşılaştırmanın anlam kazanması için bu sürümü teste sok.</div>") +
    "</div></div>";
  }

  // Yeni sürüm formu
  var sug = nextVersionLabels(latest ? latest.label : "");
  html += '<div class="section"><h2>Yeni Sürüm Çıkar</h2><div class="card"><div class="form-grid">' +
    '<div class="form-row">' +
      '<div class="field"><label>Sürüm etiketi <span class="req-star">*</span></label>' +
      '<input id="nv-label" placeholder="' + esc(sug.patch) + '" value="' + esc(sug.patch) + '">' +
      '<div class="help">Hızlı seç: ' +
        '<button type="button" class="btn ghost sm" style="padding:2px 9px;font-size:11.5px" onclick="document.getElementById(\'nv-label\').value=\'' + sug.patch + '\'">' + sug.patch + "</button> " +
        '<button type="button" class="btn ghost sm" style="padding:2px 9px;font-size:11.5px" onclick="document.getElementById(\'nv-label\').value=\'' + sug.major + '\'">' + sug.major + "</button>" +
      "</div></div>" +
      '<div class="field"><label>Sürüm linki <span class="req-star">*</span></label>' +
      '<input id="nv-url" placeholder="https://urunun.app/v2" value="' + esc(latest ? latest.url : "") + '"></div>' +
    "</div>" +
    '<div class="field"><label>Bu sürümde ne değişti? <span class="req-star">*</span></label>' +
    '<textarea id="nv-notes" placeholder="Testçilere gösterilecek değişiklik notu: hangi sorunları ele aldın, neye odaklanmalarını istiyorsun?"></textarea></div>';

  // Hâlâ açık olan numaralı buglar — kurucu neyi kapattığını burada tikler,
  // işaretler yeni sürümün notuna aynen taşınır.
  var pend = pendingBugs(me.id);
  if (pend && pend.open.length) {
    html += '<div class="field"><label>Açık buglar (' + pend.open.length + " / " + pend.total + ")</label>" +
      '<div class="help">' + esc(pend.source.label) + " testlerinde bildirildi" +
      (pend.closed ? ", " + pend.closed + " tanesi önceki sürümlerde kapatıldı" : "") +
      ". Bu sürümde hangilerini çözdüğünü işaretle — sürüm notunda tikleriyle yayınlanır.<br>" +
      FIX_ORDER.map(function (k) { return FIX_STATES[k].icon + " " + FIX_STATES[k].label; }).join(" · ") +
      ' <button type="button" class="btn ghost sm" style="padding:2px 9px;font-size:11.5px;margin-left:4px" onclick="markAllFixed(\'nv\')">Tümünü ✅ işaretle</button>' +
      ' <button type="button" class="btn ghost sm" style="padding:2px 9px;font-size:11.5px" onclick="exportOpenBugs(\'' + pend.source.id + '\')">Tüm açık bugları kopyala</button></div>' +
      '<div class="buglist">' + pend.open.map(function (r) { return bugRow(r.bug, r.state, "nv", true); }).join("") + "</div></div>";
  } else if (pend) {
    html += '<div class="escrow-preview">' + esc(pend.source.label) + " testlerinde bildirilen <strong>" +
      pend.total + " bugun tamamı kapatıldı</strong> ✓ Bu sürümü teste soktuğunda yeni maddeler burada listelenir.</div>";
  }

  // Önceki sürümün şikâyet temaları — yeni sürümde neyi hedeflediğini yazmak için
  if (latest) {
    var ls = versionStats(latest.id);
    if (ls.bugThemes.length || ls.uxThemes.length) {
      html += '<div class="escrow-preview"><strong>' + esc(latest.label) + "</strong> testlerinde tekrar eden temalar — yeni sürümde bunları çözdüysen not düş:<br>" +
        '<div class="tag-row" style="margin-top:8px">' +
        ls.bugThemes.slice(0, 5).map(function (k) { return '<span class="tag">' + esc(k.word) + " <b>×" + k.count + "</b></span>"; }).join("") +
        ls.uxThemes.slice(0, 5).map(function (k) { return '<span class="tag">' + esc(k.word) + " <b>×" + k.count + "</b></span>"; }).join("") +
        "</div></div>";
    }
  }

  html += '<div><button class="btn primary" onclick="createVersion()">Sürümü Oluştur</button>' +
    '<span style="font-size:12.5px;color:var(--muted);margin-left:10px">Sürüm oluşturmak token harcamaz; teste sokarken escrow devreye girer.</span></div>' +
    "</div></div></div>";

  // Sürüm listesi (zaman çizelgesi)
  html += '<div class="section"><h2>Sürüm Geçmişi (' + vers.length + ")</h2><div class=\"card\">";
  if (!vers.length) {
    html += '<div class="empty">Henüz sürüm yok. Yukarıdaki formla ilk sürümünü oluştur, sonra teste sok.</div>';
  } else {
    var ordered = vers.slice().reverse();
    html += '<div class="ver-list">' + ordered.map(function (v, i) {
      var st = versionStatus(v.id);
      var stats = versionStats(v.id);
      var isLatest = latest && v.id === latest.id;
      var idx = vers.indexOf(v);
      var before = idx > 0 ? versionStats(vers[idx - 1].id) : null;
      var cl = changelogOf(v);

      return '<div class="ver-item ' + st.key + '">' +
        '<div class="rail"><div class="dot"></div>' + (i < ordered.length - 1 ? '<div class="line"></div>' : "") + "</div>" +
        '<div class="body">' +
          '<div class="head">' + verBadge(v, isLatest) +
            '<span class="badge ' + st.cls + '">' + st.label + "</span>" +
            (isLatest ? '<span class="badge violet">Güncel sürüm</span>' : "") +
            '<span style="font-size:12px;color:var(--muted)">' + timeAgo(v.createdAt) + " · " + esc(v.url) + "</span>" +
          "</div>" +
          '<div class="notes">' + esc(v.notes) + "</div>" +
          '<div class="metrics">' +
            "<span>Test: <b>" + stats.tests + "</b></span>" +
            "<span>Puan: <b>" + (stats.tests ? stats.avgRating.toFixed(1) : "—") + "</b>" +
              (before && before.tests && stats.tests ? " " + deltaTag(Math.round(stats.avgRating * 10) / 10, Math.round(before.avgRating * 10) / 10) : "") + "</span>" +
            "<span>" + esc(stats.intentLabel) + ": <b>" + (stats.tests ? "%" + stats.wouldUsePct : "—") + "</b>" +
              (before && before.tests && stats.tests ? " " + deltaTag(stats.wouldUsePct, before.wouldUsePct) : "") + "</span>" +
            "<span>Talep: <b>" + stats.requests + "</b>" + (stats.openRequests ? " (" + stats.openRequests + " açık)" : "") + "</span>" +
            (cl ? '<span title="' + esc(cl.source.label) + ' buglarından kaçı bu sürümde kapatıldı"><b>' +
              cl.fixedCount + "/" + cl.total + "</b> düzeltildi</span>" : "") +
          "</div>" +
        "</div>" +
        '<div class="acts">' +
          '<button class="btn primary sm" onclick="go(\'newRequest\',\'' + v.id + '\')">Teste Sok</button>' +
          '<button class="btn sm" onclick="go(\'version\',\'' + v.id + '\')">Karne</button>' +
        "</div></div>";
    }).join("") + "</div>";
  }
  html += "</div></div>";

  return html;
}

function createVersion() {
  var me = currentUser();
  var label = (document.getElementById("nv-label").value || "").trim();
  var url = (document.getElementById("nv-url").value || "").trim();
  var notes = (document.getElementById("nv-notes").value || "").trim();

  // Alan doğrulaması sunucuda tekrarlanır; buradaki kontroller yalnızca hızlı geri bildirim.
  if (!label || !url || !notes) { toast("Sürüm etiketi, link ve değişiklik notu zorunlu.", "bad"); return; }
  if (url.indexOf("http") !== 0) { toast("Sürüm linki http(s) ile başlamalı.", "bad"); return; }

  act(Api.createVersion({
    label: label, url: url, notes: notes,
    fixes: collectFixes("nv") // formdaki bug tikleri sürüm notuna gömülür
  }), function () {
    // Yeni sürüm listenin sonundadır; kullanıcıyı doğrudan teste sokma adımına götür.
    var mine = versionsOf(me.id);
    var created = mine[mine.length - 1];
    if (created) go("newRequest", created.id);
  });
}

/* ---------------- Sürüm Karnesi ---------------- */

function viewVersion(versionId) {
  var v = getVersion(versionId);
  if (!v) return '<div class="card"><div class="empty">Sürüm bulunamadı.</div></div>';
  var me = currentUser();
  var owner = getUser(v.ownerId);
  var isOwner = owner.id === me.id;
  var vers = versionsOf(v.ownerId);
  var idx = vers.indexOf(v);
  var prev = idx > 0 ? vers[idx - 1] : null;
  var stats = versionStats(v.id);
  var prevStats = prev ? versionStats(prev.id) : null;
  var st = versionStatus(v.id);

  var html = '<div class="page-head">' +
    '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px">' +
      verBadge(v, idx === vers.length - 1) +
      '<span class="badge ' + st.cls + '">' + st.label + "</span>" +
      '<span style="font-size:12.5px;color:var(--muted)">' + fmtDate(v.createdAt) + " · " + esc(v.url) + "</span>" +
    "</div>" +
    "<h1>" + esc(subtitleOf(owner)) + " " + esc(v.label) + " karnesi</h1>" +
    '<div class="sub">' + esc(v.notes) + "</div></div>";

  html += '<div class="section"><div class="tiles">' +
    '<div class="tile accent"><div class="label">Onaylı Test</div><div class="value">' + stats.tests + "</div></div>" +
    '<div class="tile"><div class="label">Ortalama Puan</div><div class="value">' + (stats.tests ? stats.avgRating.toFixed(1) : "—") + '</div><div class="hint">' + (stats.tests ? '<span class="star-static">' + starStr(stats.avgRating) + "</span>" : "henüz test yok") + "</div></div>" +
    '<div class="tile"><div class="label">' + esc(stats.intentLabel) + '</div><div class="value">' + (stats.tests ? "%" + stats.wouldUsePct : "—") + "</div></div>" +
    '<div class="tile"><div class="label">Açılan Talep</div><div class="value">' + stats.requests + '</div><div class="hint">' + stats.openRequests + " açık</div></div>" +
  "</div></div>";

  // Sürüm notu: önceki sürümde bildirilen numaralı buglar + bu sürümdeki durumları
  var cl = changelogOf(v);
  if (cl) {
    html += '<div class="section"><h2>' + esc(v.label) + ' Sürüm Notları ' +
        '<span style="font-weight:400;font-size:13px;color:var(--muted)">(' + esc(cl.source.label) + " testlerinde bildirilen buglar)</span></h2>" +
      '<div class="card printable">' +
        '<p style="color:var(--ink-2);margin-bottom:14px">' + esc(v.notes) + "</p>" +
        changelogSummary(cl) +
        '<div style="margin-top:14px">' + changelogTable(cl) + "</div>" +
        FIX_LEGEND;

    if (isOwner) {
      html += '<details class="no-print" style="margin-top:14px">' +
        '<summary style="cursor:pointer;font-size:13px;color:var(--accent)">İşaretleri düzenle</summary>' +
        '<div class="help" style="margin-top:8px">Bir bugu sonradan kapattıysan burada güncelle; aynı butona tekrar basmak işareti kaldırır.</div>' +
        '<div class="buglist">' + cl.rows.map(function (r) { return bugRow(r.bug, r.state, "ed", true); }).join("") + "</div>" +
        '<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">' +
          '<button class="btn primary sm" onclick="saveFixes(\'' + v.id + '\')">İşaretleri Kaydet</button>' +
          '<button class="btn ghost sm" onclick="markAllFixed(\'ed\')">Tümünü ✅ işaretle</button>' +
        "</div></details>";
    }

    html += '<div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap" class="no-print">' +
        '<button class="btn ghost sm" onclick="copyChangelog(\'' + v.id + '\')">Sürüm notunu kopyala (markdown)</button>' +
        '<button class="btn ghost sm" onclick="window.print()">Yazdır / PDF</button>' +
      "</div></div></div>";
  }

  // Bu sürüme gelen ham bug listesi — bir sonraki sürümde kapatılacak maddeler
  var ownBugs = isOwner ? versionBugs(v.id) : [];
  if (ownBugs.length) {
    html += '<div class="section"><h2>' + esc(v.label) + " İçin Bildirilen Buglar (" + ownBugs.length + ")</h2>" +
      '<div class="card"><div class="help">Testçilerin bu sürümde bulduğu maddeler, geliş sırasına göre numaralandı. ' +
      "Yeni sürüm çıkarırken bu liste karşına gelir ve düzelttiklerini işaretlersin. " +
      "Her satırdaki <strong>GitHub</strong> / <strong>Jira</strong> butonları o bugu issue formatında panoya kopyalar.</div>" +
      '<div class="buglist">' + ownBugs.map(function (b) { return bugRow(b, null, null, true); }).join("") + "</div>" +
      '<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap" class="no-print">' +
        '<button class="btn sm" onclick="exportOpenBugs(\'' + v.id + '\')">Tüm açık bugları kopyala (' + openBugsOf(v.id).length + ")</button>" +
        '<button class="btn primary sm" onclick="go(\'versions\')">Yeni sürüm çıkar &amp; işaretle</button>' +
      "</div></div></div>";
  }

  if (prev) {
    html += '<div class="section"><h2>' + esc(prev.label) + " → " + esc(v.label) + "</h2><div class=\"card\"><div class=\"compare-rows\">" +
      compareRow("Ortalama puan", prevStats.tests ? Math.round(prevStats.avgRating * 10) / 10 : null, stats.tests ? Math.round(stats.avgRating * 10) / 10 : null) +
      compareRow("\"" + stats.intentLabel + "\" oranı", prevStats.tests ? prevStats.wouldUsePct : null, stats.tests ? stats.wouldUsePct : null, { suffix: " puan", fmt: function (x) { return "%" + x; } }) +
      compareRow("Ortalama test süresi", prevStats.tests ? prevStats.avgDuration : null, stats.tests ? stats.avgDuration : null, { suffix: " dk", fmt: function (x) { return x + " dk"; } }) +
      themeCompareRows(prevStats, stats) +
      "</div>" +
      (prevStats.bugThemes.length ? '<div style="margin-top:14px"><h4 style="font-size:13px;margin-bottom:8px">' + esc(prev.label) + " sürümünde tekrar eden bug temaları</h4>" +
        '<div class="tag-row">' + prevStats.bugThemes.map(function (k) {
          var stillThere = stats.bugThemes.some(function (x) { return x.word === k.word; });
          return '<span class="tag">' + (stillThere ? "" : "✓ ") + esc(k.word) + " <b>" + (stillThere ? "hâlâ var" : "geçti") + "</b></span>";
        }).join("") + "</div>" +
        '<p style="font-size:12px;color:var(--muted);margin-top:6px">Kural tabanlı karşılaştırma: önceki sürümde tekrar eden kelime yeni sürümün feedback\'lerinde de geçiyorsa "hâlâ var" olarak işaretlenir.</p></div>' : "") +
      "</div></div>";
  }

  // Sürümün sentez raporu (sahibi görür)
  if (isOwner && stats.syn) {
    var syn = stats.syn;
    html += '<div class="section"><h2>Sürüm Sentez Raporu <span style="font-weight:400;font-size:13px;color:var(--muted)">(' + syn.testerCount + ' testçiden otomatik özet)</span></h2>' +
      '<div class="card printable">' +
        (syn.impressionThemes.length ? '<div><h4 style="font-size:13px;margin-bottom:8px">İlk İzlenim Temaları</h4><div class="tag-row">' + syn.impressionThemes.map(function (k) { return '<span class="tag">' + esc(k.word) + " <b>×" + k.count + "</b></span>"; }).join("") + "</div></div>" : "") +
        (syn.bugThemes.length ? '<div style="margin-top:12px"><h4 style="font-size:13px;margin-bottom:8px">Bug Temaları</h4><div class="tag-row">' + syn.bugThemes.map(function (k) { return '<span class="tag">' + esc(k.word) + " <b>×" + k.count + "</b></span>"; }).join("") + "</div></div>" : "") +
        (syn.uxThemes.length ? '<div style="margin-top:12px"><h4 style="font-size:13px;margin-bottom:8px">UX Temaları</h4><div class="tag-row">' + syn.uxThemes.map(function (k) { return '<span class="tag">' + esc(k.word) + " <b>×" + k.count + "</b></span>"; }).join("") + "</div></div>" : "") +
        '<div style="margin-top:16px" class="no-print"><button class="btn ghost sm" onclick="window.print()">Karneyi Yazdır / PDF Kaydet</button></div>' +
      "</div></div>";
  }

  // Bu sürüm için açılan talepler
  html += '<div class="section"><h2>Bu Sürümün Testleri</h2><div class="card">';
  var rs = versionRequests(v.id);
  if (rs.length) {
    html += rs.map(function (r) {
      var taken = slotsTaken(r.id);
      return '<div class="row-item" style="cursor:pointer" onclick="go(\'request\',\'' + r.id + '\')">' +
        '<div class="grow"><div class="title">' + esc(r.title) + "</div>" +
        '<div class="meta">' + esc(r.feedbackType) + " · " + r.credits + " token · " + taken + "/" + r.slots + " slot · " + timeAgo(r.createdAt) + "</div></div>" +
        (r.status === "open" ? '<span class="badge good">Açık</span>' : '<span class="badge">Kapalı</span>') + "</div>";
    }).join("");
  } else {
    html += '<div class="empty">Bu sürüm henüz teste sokulmadı.' +
      (isOwner ? ' <a href="javascript:go(\'newRequest\',\'' + v.id + '\')">Test talebi aç</a>' : "") + "</div>";
  }
  html += "</div></div>";

  if (isOwner) {
    html += '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
      '<button class="btn primary" onclick="go(\'newRequest\',\'' + v.id + '\')">Bu sürümü teste sok</button>' +
      '<button class="btn ghost" onclick="go(\'versions\')">← Tüm sürümler</button></div>';
  }

  return html;
}

/* ---------------- Token Satın Al (kurucu) ---------------- */

var checkoutPkg = null;  // seçili paket id'si
var buyTab = "once";     // "once" = tek seferlik paket, "sub" = abonelik
var checkoutPlan = null; // seçili abonelik planı id'si

function setBuyTab(tab) {
  buyTab = tab;
  checkoutPkg = null;
  checkoutPlan = null;
  render();
  window.scrollTo(0, 0);
}

function selectPlan(planId) {
  checkoutPlan = checkoutPlan === planId ? null : planId;
  render();
}

// Abonelik sekmesi: aktif abonelik varsa durum kartı, yoksa plan seçimi.
function viewSubscriptionTab(me) {
  var active = subscriptionOf(me);
  var html = "";

  if (active) {
    var split = planSplit(active.plan);
    var mine = S.purchases.filter(function (p) { return p.userId === me.id && p.kind === "subscription"; });
    html += '<div class="section"><h2>Aboneliğin</h2><div class="card">' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px">' +
        '<span class="badge good">Aktif</span>' +
        '<span class="badge credit">' + esc(active.plan.name) + " · " + fmtTRY(active.plan.price) + "/ay</span>" +
        (active.plan.priority ? '<span class="badge violet">Öncelikli eşleştirme</span>' : "") +
      "</div>" +
      '<div class="checkout">' +
        '<div class="row"><span>Aylık token kredisi</span><span>' + active.plan.tokens + " token (~" + active.plan.testers + " testçi)</span></div>" +
        '<div class="row"><span>Bugüne kadar yenileme</span><span>' + mine.length + " dönem · " + mine.reduce(function (a, p) { return a + p.tokens; }, 0) + " token</span></div>" +
        '<div class="row"><span>Sonraki yenileme</span><span>' + fmtDate(active.sub.renewsAt) + "</span></div>" +
        '<div class="row total"><span>Aylık tutar</span><span class="money">' + fmtTRY(active.plan.price) + "</span></div>" +
      "</div>" +
      '<div class="notice" style="margin:14px 0 0">Demo ortamında zamanlayıcı yoktur. Aşağıdaki buton bir ayı ileri sarar: ' +
        active.plan.tokens + " token basılır, " + fmtTRY(split.fee) + " platform gelirine, " + fmtTRY(split.pool) + " testçi ödül havuzuna yazılır.</div>" +
      '<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">' +
        '<button class="btn primary" onclick="renewSubscription()">Bu ayı simüle et &amp; yenile</button>' +
        '<button class="btn danger sm" onclick="cancelSubscription()">Aboneliği iptal et</button>' +
      "</div></div></div>";
  }

  html += '<div class="section"><h2>' + (active ? "Plan Değiştir" : "Aylık Planlar") + "</h2>" +
    '<div class="pkg-grid">' + SUBSCRIPTION_PLANS.map(function (p) {
      var isCurrent = active && active.plan.id === p.id;
      var perToken = Math.round((p.price / p.tokens) * 100) / 100;
      return '<div class="pkg' + (p.popular ? " popular" : "") + '">' +
        (p.popular ? '<span class="flag">En çok tercih edilen</span>' : "") +
        "<h3>" + esc(p.name) + "</h3>" +
        '<div class="price money">' + fmtTRY(p.price) + " <small>/ay +KDV</small></div>" +
        '<div class="unit">' + p.tokens + " token/ay · ~" + p.testers + " testçi · " + fmtTRY(perToken) + "/token</div>" +
        "<ul>" + p.perks.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>" +
        (isCurrent
          ? '<button class="btn" disabled>Mevcut planın</button>'
          : '<button class="btn ' + (checkoutPlan === p.id ? "" : "primary") + '" onclick="selectPlan(\'' + p.id + '\')">' +
            (checkoutPlan === p.id ? "Seçildi ✓" : (active ? "Bu plana geç" : "Bu planı seç")) + "</button>") +
      "</div>";
    }).join("") + "</div>" +
    '<p style="color:var(--muted);font-size:13px;margin-top:14px">Tek seferlik pakette token ' + fmtTRY(tokenPrice()) +
    "; abonelikte daha ucuzdur. İndirim platform komisyonundan karşılanır — testçi ödül havuzuna her token için " +
    fmtTRY(payoutRate()) + " yatmaya devam eder.</p></div>";

  var plan = getPlan(checkoutPlan);
  if (plan) {
    var s = planSplit(plan);
